; PgBouncer for `pnpm perf:go`: transaction pooling, as doc 01 section 9.2
; describes. Every database name is forwarded to the throwaway Postgres of
; compose.perf.yml, because the measurement creates its own database.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = slugbase_perf_admin
pool_mode = transaction
default_pool_size = 10
max_client_conn = 500
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
