; PgBouncer for the pooled test run (doc 08 section 3.2): transaction pooling
; with a server pool of one connection, so every client of a test database
; shares one Postgres backend and a setting that outlives its transaction is
; met by the next request. Every database name is forwarded to the development
; Postgres of compose.dev.yml, because each test file creates its own database.
[databases]
* = host=postgres port=54329

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = slugbase_pooler_admin
pool_mode = transaction
default_pool_size = 1
min_pool_size = 0
reserve_pool_size = 0
max_client_conn = 200
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
