# Local self-host smoke test — split API + web containers.
# Staging CI pushes ghcr.io/mdg-labs/slugbase-api:dev and slugbase-web:dev on each
# affected staging deploy (CE VITE_* baked at web image build — see
# scripts/self-host-vite-build-args.sh).
#
# Prerequisites:
#   docker login ghcr.io -u <github-username> -p <github-pat-with-read:packages>
#
# Usage:
#   docker compose -f dev.docker-compose.yml up -d
#   open http://localhost:3341
#   curl -sf http://localhost:3341/health
#   curl -sf http://localhost:3000/health   # API (published for local debugging)
#
# First visit: /setup (instance admin) unless PUBLIC_REGISTRATION=true.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slugbase
      POSTGRES_PASSWORD: slugbase
      POSTGRES_DB: slugbase
    volumes:
      - slugbase_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slugbase -d slugbase"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    image: ghcr.io/mdg-labs/slugbase-api:dev
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      SLUGBASE_EDITION: ce
      SERVE_WEB_CLIENT: "false"

      # Required secrets (replace before any non-local use)
      SESSION_SECRET: local-dev-session-secret-at-least-32-chars!!
      ENCRYPTION_KEY: local-dev-encryption-key-at-least-32-chars!!

      # Database — hostname is the compose service name
      DATABASE_URL: postgresql://slugbase:slugbase@postgres:5432/slugbase

      # Public URLs — match what users open in the browser (web service port)
      APP_BASE_URL: http://localhost:3341
      FRONTEND_ORIGIN: http://localhost:3341

      # Self-host defaults (easy local testing)
      PUBLIC_REGISTRATION: "false"
      EMAIL_VERIFICATION_REQUIRED: "false"
      PORT: "3000"

      # Operator-managed credentials (spec §11.1–§11.3, §15) — env on api only.
      # Omit all blocks below for no-op mail / AI / OIDC (graceful degrade on send).
      #
      # SMTP_HOST: mail.example.com
      # SMTP_PORT: "587"
      # SMTP_SECURE: "false"
      # SMTP_USER: smtp-user@example.com
      # SMTP_PASS: replace-me
      # SMTP_FROM: noreply@example.com
      #
      # OPENAI_API_KEY: sk-replace-me
      # OPENAI_MODEL: gpt-4o-mini
      #
      # OIDC_google_CLIENT_ID: replace-me
      # OIDC_google_CLIENT_SECRET: replace-me
      # OIDC_google_ISSUER_URL: https://accounts.google.com
      # OIDC_google_NAME: Google
      # OIDC_google_SCOPES: openid email profile
      # OIDC_google_ENABLED: "true"

      CHALLENGE_DEV_SKIP: "true"
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s

  web:
    image: ghcr.io/mdg-labs/slugbase-web:dev
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3341:3000"
    environment:
      API_BASE_URL: http://api:3000
      PORT: "3000"
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s

volumes:
  slugbase_pgdata:
