# Ephemeral Postgres for Playwright e2e tests (spec §22.4).
# Services (API, web, marketing) are started by the CI workflow or locally.
# Usage: docker compose -f docker-compose.e2e.yml up --wait

services:
  postgres:
    image: postgres:16-alpine
    container_name: slugbase-e2e-postgres
    ports:
      - '5432'
    expose:
      - 5432
    environment:
      POSTGRES_USER: slugbase
      POSTGRES_PASSWORD: slugbase
      POSTGRES_DB: slugbase_e2e
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slugbase -d slugbase_e2e']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data