# Shared development services (doc 08 §1.2). Every checkout and scratch clone on
# the machine uses this one stack, so the project name is fixed and does not
# depend on the directory the file is run from.
#   pnpm dev:services        start and wait until healthy
#   pnpm dev:services:down   stop (the data volume is kept)
# Development defaults only: nothing here is a secret.
name: slugbase-dev

services:
  postgres:
    image: postgres:18
    # Postgres listens on the published port inside the container too, so the
    # default Postgres port is not mapped anywhere. max_connections is raised
    # from the default of 100 so that several concurrent integration runs
    # (doc 08 section 1.2) and the developer's own processes fit.
    #
    # fsync, synchronous_commit and full_page_writes are off: this cluster holds
    # only disposable development and test data (every test database is created
    # from a template and dropped again, and the seed data can be recreated), so
    # a crash may lose or corrupt it and nothing else is lost. Without them the
    # DROP DATABASE of each test database does not wait for a checkpoint to
    # flush to disk (doc 08 section 3.2). Never copy these settings to a
    # Postgres that holds data worth keeping; if the container or the host
    # crashes, provision it again (docker compose -f compose.dev.yml down -v,
    # then pnpm dev:services).
    command:
      [
        "postgres",
        "-c", "port=54329",
        "-c", "max_connections=300",
        "-c", "fsync=off",
        "-c", "synchronous_commit=off",
        "-c", "full_page_writes=off",
      ]
    environment:
      POSTGRES_USER: slugbase
      POSTGRES_PASSWORD: slugbase
      POSTGRES_DB: slugbase_dev
      # Passwords of the application roles that roles.sql creates on first
      # start. Development-only values, which the configuration schema is to
      # refuse in production (E1.4.1).
      PROVISION_APP_PASSWORD: slugbase_app_dev_only
      PROVISION_MIGRATOR_PASSWORD: slugbase_migrator_dev_only
    ports:
      - "127.0.0.1:54329:54329"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, when the data volume is empty. To provision again from
      # scratch: docker compose -f compose.dev.yml down -v, then pnpm dev:services.
      - ./packages/db/provision/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 54329 -U slugbase -d slugbase_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
