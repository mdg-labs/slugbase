server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /health {
    try_files /health /health/index.html =404;
    default_type application/json;
  }

  location = /version {
    try_files /version /version/index.html =404;
    default_type application/json;
  }
}
