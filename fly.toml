# Fly.io API deploy (hosted — spec §14.7, eng §10)
# App name: slugbase-staging-api (staging) / slugbase-production-api (production)
# Build: Dockerfile.api — API-only variant from spec §14.2

app = "slugbase-staging-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.api"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
