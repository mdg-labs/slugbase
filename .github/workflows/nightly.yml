name: Nightly

# The scheduled checks of doc 08 section 5.3 and 6.2 that no developer's gate waits for. Today that is the performance budgets: the
# CE image, built here from the commit under test and never pulled, and k6 (scripts/perf/run.mjs) against a database that the test
# harness made and filled with the large instance (50 000 bookmarks in one workspace, 2 000 further workspaces), with PostgreSQL on
# the same runner. It runs every week and on a pull request to `main`, which is the promotion. A budget that is exceeded, or a /go
# that writes more than the usage buffer allows, is filed under an issue of its scenario (go, list, search, write load; scripts/perf/report.mjs), a new one
# or a comment on the one that is open, and does not fail the job; a run that could not measure fails it, and so does a filing that did not succeed, so that a
# regression is never dropped silently. The job holds the workflow token with `issues: write` and nothing else, references no
# secret, and the workflow never runs on pull_request_target (doc 10 T16).

on:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  performance:
    name: performance budgets
    # A pull request from a fork gets a read-only token and cannot open an issue.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:18@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
        env:
          POSTGRES_USER: slugbase_ci
          POSTGRES_PASSWORD: slugbase_ci
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: nightly
      # The seed writes through psql (packages/testing/src/seed/run.ts), which the runner image carries.
      - name: Check the tools the run needs
        run: |
          set -euo pipefail
          command -v psql
          docker version --format '{{.Server.Version}}'
      - name: Build the seed
        run: pnpm turbo run build --filter=@slugbase/testing
      # Built from the checked-out commit, the way the build job of ci.yml does, and not pushed or pulled: the server under load is this image.
      - name: Build the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: docker build -f apps/slugbase/Dockerfile --build-arg "BUILD_COMMIT=$BUILD_COMMIT" -t slugbase:perf .
      - name: Pull k6
        run: docker pull "$(sed -n 's/^const K6_IMAGE = "\(.*\)";$/\1/p' scripts/perf/run.mjs)"
      # Exit status 10 is a budget that was exceeded, or a /go that wrote more than the usage buffer allows: the result is
      # reported below and the job goes on. Any other status is a run that could not measure, and fails the job.
      - name: Measure the budgets
        id: measure
        env:
          SLUGBASE_TEST_PG_URL: postgres://slugbase_ci:slugbase_ci@127.0.0.1:5432/postgres
          # The commit the result names: the head of a pull request (the checkout is its merge with `main`), otherwise the commit that ran.
          MEASURED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          node scripts/perf/run.mjs --image slugbase:perf --commit "$MEASURED_COMMIT" --out perf-results
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 10 ]; then
            exit "$status"
          fi
      - name: Report the result
        if: ${{ always() && hashFiles('perf-results/result.json') != '' }}
        run: |
          set -euo pipefail
          {
            echo "### Performance budgets"
            echo
            jq -r '"Commit: `\(.commit // "unknown")`. Database: \(.database.bookmarks) bookmarks, \(.database.workspaces) workspaces, the largest with \(.database.largestWorkspace). Load: \(.rate) requests a second for \(.durationSeconds) s per scenario."' perf-results/result.json
            echo
            echo "| Scenario | Requests completed | Dropped iterations | Peak VUs | |"
            echo "|---|---|---|---|---|"
            jq -r '.scenarios | to_entries[] | "| \(.key) | \(.value.completed) | \(.value.dropped) | \(.value.peakVus) of \(.value.maxVus) | \(if .value.saturated then "saturated" else "" end) |"' perf-results/result.json
            echo
            jq -r 'if ([.scenarios[] | select(.saturated)] | length) > 0 then "A saturated scenario dropped arrivals or used every VU it may, so its requests waited for a server that could not keep up: its p95 includes that queue and is not the time of one statement." else empty end' perf-results/result.json
            echo
            echo "| Scenario | p95 server time | Budget | |"
            echo "|---|---|---|---|"
            jq -r '.budgets[] | "| \(.name) | \(.p95Ms) ms | \(.limitMs) ms | \(if .ok then "ok" else "exceeded" end)\(if .saturated then " (saturated)" else "" end) |"' perf-results/result.json
            echo
            jq -r '"Write load: \(.writeLoad.requests) requests for one slug updated \(.writeLoad.updates) rows of bookmarks in \(.writeLoad.elapsedSeconds) s (at most \(.writeLoad.limit): one for each flush interval of \(.writeLoad.flushIntervalSeconds) s, and one more), \(if .writeLoad.ok then "ok" else "exceeded" end)."' perf-results/result.json
          } >> "$GITHUB_STEP_SUMMARY"
      # What to file is decided by scripts/perf/report.mjs (tested in tooling/test/perf-report.test.ts) from the result and the open issues; this step only runs
      # its actions. Each exceeded scenario (go, list, search) and the write load of /go has one issue titled "Performance budget exceeded: <name>", which a later
      # run extends with a comment. Nothing of the result or of an issue reaches the shell as code: the titles and bodies come from files and the arguments are quoted.
      - name: Open an issue for an exceeded budget
        if: ${{ steps.measure.outputs.status == '10' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          gh issue list --repo "$REPOSITORY" --state open --search 'in:title "Performance budget exceeded"' --limit 200 --json number,title > "$work/issues.json"
          node scripts/perf/report.mjs --result perf-results/result.json --issues "$work/issues.json" --run-url "$RUN_URL" --event "$EVENT" --body-dir "$work/bodies" --expect-action > "$work/actions.json"
          # One line an action: kind, issue number (or "-"), body file, title. Node reads the JSON (the unit job that tests this step has no jq); a field with a tab or a line break would
          # shift the fields of its line or add a line, so the step stops on one instead of reading it.
          node -e '
            const fs = require("node:fs");
            const actions = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const lines = actions.map((a) => {
              const fields = [String(a.kind), a.number == null ? "-" : String(a.number), String(a.bodyFile), String(a.title)];
              if (fields.some((f) => /[\t\r\n]/.test(f))) throw new Error("an action field holds a tab or a line break");
              return fields.join("\t") + "\n";
            });
            fs.writeFileSync(process.argv[2], lines.join(""));
          ' "$work/actions.json" "$work/actions.tsv"
          # Every action is tried, and the step fails at the end if one did not succeed; an action is reported done only when it was.
          failed=0
          while IFS=$'\t' read -r kind number body_file title; do
            if [ "$kind" = "comment" ]; then
              if gh issue comment "$number" --repo "$REPOSITORY" --body-file "$body_file"; then
                echo "commented on #${number}: ${title}"
              else
                echo "::error::could not comment on #${number}: ${title}"
                failed=1
              fi
            elif [ "$kind" = "create" ]; then
              if gh issue create --repo "$REPOSITORY" --title "$title" --label "area:ci" --body-file "$body_file"; then
                echo "created: ${title}"
              else
                echo "::error::could not create: ${title}"
                failed=1
              fi
            else
              echo "::error::unknown action ${kind}"
              failed=1
            fi
          done < "$work/actions.tsv"
          exit "$failed"
      - name: Upload the result
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-results
          path: perf-results/
          if-no-files-found: ignore
          retention-days: 30
