name: Sync secrets

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Actions environment (staging | production)
        type: string
        required: true
      services:
        description: Comma-separated services or "all"
        type: string
        default: all
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      services:
        description: Services to sync (comma-separated, or "all")
        type: string
        default: all

permissions:
  contents: read

jobs:
  sync:
    name: Sync secrets (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup flyctl
        run: bash .github/scripts/setup-flyctl.sh

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Sync secrets to Fly.io and Cloudflare Workers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          SLUGBASE_EDITION: ${{ secrets.SLUGBASE_EDITION }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          MARKETING_ORIGIN: ${{ secrets.MARKETING_ORIGIN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PUBLIC_REGISTRATION: ${{ secrets.PUBLIC_REGISTRATION }}
          EMAIL_VERIFICATION_REQUIRED: ${{ secrets.EMAIL_VERIFICATION_REQUIRED }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PERSONAL_MONTHLY: ${{ secrets.STRIPE_PRICE_PERSONAL_MONTHLY }}
          STRIPE_PRICE_PERSONAL_ANNUAL: ${{ secrets.STRIPE_PRICE_PERSONAL_ANNUAL }}
          STRIPE_PRICE_TEAM_MONTHLY: ${{ secrets.STRIPE_PRICE_TEAM_MONTHLY }}
          STRIPE_PRICE_TEAM_ANNUAL: ${{ secrets.STRIPE_PRICE_TEAM_ANNUAL }}
          STRIPE_PRICE_SUPPORTER: ${{ secrets.STRIPE_PRICE_SUPPORTER }}
          SUPPORTER_PROMOTION_END: ${{ secrets.SUPPORTER_PROMOTION_END }}
          DOWNGRADE_GRACE_PERIOD_DAYS: ${{ secrets.DOWNGRADE_GRACE_PERIOD_DAYS }}
          SESSION_TTL_DAYS: ${{ secrets.SESSION_TTL_DAYS }}
          SESSION_REMEMBER_TTL_DAYS: ${{ secrets.SESSION_REMEMBER_TTL_DAYS }}
          MFA_TOTP_ISSUER: ${{ secrets.MFA_TOTP_ISSUER }}
          RATE_LIMIT_LOGIN_MAX: ${{ secrets.RATE_LIMIT_LOGIN_MAX }}
          RATE_LIMIT_LOGIN_TTL_SECONDS: ${{ secrets.RATE_LIMIT_LOGIN_TTL_SECONDS }}
          RATE_LIMIT_TOKEN_CREATION_MAX: ${{ secrets.RATE_LIMIT_TOKEN_CREATION_MAX }}
          RATE_LIMIT_TOKEN_CREATION_TTL_SECONDS: ${{ secrets.RATE_LIMIT_TOKEN_CREATION_TTL_SECONDS }}
          RATE_LIMIT_EMAIL_VERIFICATION_MAX: ${{ secrets.RATE_LIMIT_EMAIL_VERIFICATION_MAX }}
          RATE_LIMIT_EMAIL_VERIFICATION_TTL_SECONDS: ${{ secrets.RATE_LIMIT_EMAIL_VERIFICATION_TTL_SECONDS }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CHALLENGE_DEV_SKIP: ${{ secrets.CHALLENGE_DEV_SKIP }}
          UMAMI_HOST: ${{ secrets.UMAMI_HOST }}
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.SENTRY_TRACES_SAMPLE_RATE }}
          SENTRY_PROFILING_SAMPLE_RATE: ${{ secrets.SENTRY_PROFILING_SAMPLE_RATE }}
          SENTRY_REPLAY_SAMPLE_RATE: ${{ secrets.SENTRY_REPLAY_SAMPLE_RATE }}
          SENTRY_LOG_LEVEL: ${{ secrets.SENTRY_LOG_LEVEL }}
          SENTRY_ENABLE_CONSOLE_LOGGING: ${{ secrets.SENTRY_ENABLE_CONSOLE_LOGGING }}
          OIDC_DEPLOYMENT_PROVIDERS: ${{ secrets.OIDC_DEPLOYMENT_PROVIDERS }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          ADMIN_SESSION_TTL_DAYS: ${{ secrets.ADMIN_SESSION_TTL_DAYS }}
          ADMIN_SNAPSHOT_CRON: ${{ secrets.ADMIN_SNAPSHOT_CRON }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          ADMIN_ALERT_SIGNUP_SPIKE_MULTIPLIER: ${{ secrets.ADMIN_ALERT_SIGNUP_SPIKE_MULTIPLIER }}
          SENTRY_DSN_ADMIN: ${{ secrets.SENTRY_DSN_ADMIN }}
          PORT: ${{ secrets.PORT }}
          FLY_SECRETS_MODE: ${{ github.event_name == 'workflow_dispatch' && 'stage-and-deploy' || 'stage-only' }}
        run: bash .github/scripts/sync-secrets.sh "${{ inputs.environment }}" "${{ inputs.services }}"
