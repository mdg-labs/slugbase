name: Main

# Push to main — CI gate, Changesets Version PR, and draft release (spec §22.4, §22.6).
# Production deploy remains on release published (#474).

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  changesets:
    name: Changesets
    needs: [ci]
    if: needs.ci.result == 'success'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/changesets.yml
    secrets: inherit

  prepare-release:
    name: Prepare release
    needs: [changesets]
    if: needs.changesets.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-release.yml
    with:
      published-packages: ${{ needs.changesets.outputs.published-packages }}
    secrets: inherit
