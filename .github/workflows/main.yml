name: Main

# Push to main — CE CI and bump-scoped draft release (spec §22.4, §22.6–22.7).
# Cloud production deploy lives in slugbase-cloud (open-core split TASK-007).

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  prepare-release:
    name: Prepare release
    needs: [ci]
    if: needs.ci.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-release.yml
    secrets: inherit
