name: PR

# Pull request entry point — CI for all PRs; E2E chain for staging→main (spec §22.4).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  e2e:
    name: E2E
    needs: ci
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'staging'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/e2e.yml
    with:
      mode: ''
    secrets: inherit
