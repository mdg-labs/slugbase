name: Staging

# Push to staging — CI gate, then live-version deploy plan + deploy + GHCR dev images (spec §22.4–22.5).
# Manual dispatch: use `gh workflow run staging.yml --ref <git_ref>` so CI runs on the chosen ref.

on:
  push:
    branches: [staging]

  workflow_dispatch:
    inputs:
      git_ref:
        description: Branch, tag, or SHA to build and deploy
        type: string
        default: staging
      deploy_mode:
        description: auto (live /version probes) | manual (skip live compare)
        type: choice
        options:
          - auto
          - manual
        default: auto
      services:
        description: Surfaces when deploy_mode=manual (all deploys every surface today)
        type: choice
        options:
          - all
          - api
          - web
          - marketing
          - admin
        default: all

permissions:
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-deploy-ref:
    name: Resolve deploy ref
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
      deploy_mode: ${{ steps.ref.outputs.deploy_mode }}
    steps:
      - name: Resolve ref and deploy mode
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "checkout_ref=${{ inputs.git_ref }}" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=${{ inputs.deploy_mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=" >> "$GITHUB_OUTPUT"
            echo "deploy_mode=auto" >> "$GITHUB_OUTPUT"
          fi

  assert-ci-ref:
    name: Verify CI runs on git_ref
    needs: [resolve-deploy-ref]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git_ref
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.git_ref }}

      - name: Assert workflow ref matches git_ref
        run: |
          TARGET_SHA="$(git rev-parse HEAD)"
          if [ "$TARGET_SHA" != "${{ github.sha }}" ]; then
            echo "::error::CI must run on git_ref. Re-dispatch with: gh workflow run staging.yml --ref ${{ inputs.git_ref }}"
            exit 1
          fi

  ci:
    name: CI
    needs: [assert-ci-ref]
    if: >-
      always() &&
      (needs.assert-ci-ref.result == 'success' || needs.assert-ci-ref.result == 'skipped')
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  plan:
    name: Staging · Deploy plan (GHCR gate)
    needs: [ci, resolve-deploy-ref]
    if: needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      push_ghcr_api: ${{ steps.plan.outputs.push_ghcr_api }}
      push_ghcr_web: ${{ steps.plan.outputs.push_ghcr_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ needs.resolve-deploy-ref.outputs.checkout_ref != '' && needs.resolve-deploy-ref.outputs.checkout_ref || github.sha }}

      - name: Resolve deploy plan
        id: plan
        env:
          ENVIRONMENT: staging
          DEPLOY_MODE: ${{ needs.resolve-deploy-ref.outputs.deploy_mode }}
          SHOULD_DEPLOY: "true"
          FORCE_FULL_DEPLOY: ${{ needs.resolve-deploy-ref.outputs.deploy_mode == 'manual' && 'true' || 'false' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          MARKETING_ORIGIN: ${{ vars.MARKETING_ORIGIN }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/ci/resolve-deploy-plan.mjs

  deploy:
    name: Deploy staging
    needs: [ci, resolve-deploy-ref]
    if: needs.ci.result == 'success'
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ needs.resolve-deploy-ref.outputs.checkout_ref }}
      deploy_mode: ${{ needs.resolve-deploy-ref.outputs.deploy_mode }}
      force_full_deploy: ${{ needs.resolve-deploy-ref.outputs.deploy_mode == 'manual' && 'true' || 'false' }}
    secrets: inherit

  push-ghcr-api:
    name: Staging · Push slugbase-api (GHCR dev)
    needs: [ci, plan, resolve-deploy-ref]
    if: >-
      needs.ci.result == 'success' &&
      needs.plan.outputs.push_ghcr_api == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ needs.resolve-deploy-ref.outputs.checkout_ref != '' && needs.resolve-deploy-ref.outputs.checkout_ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image (dev tag)
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          bash scripts/ci/build-push-ghcr.sh
          --target api
          ghcr.io/${{ format('{0}-api', github.repository) }}
          dev
          --no-latest

  push-ghcr-web:
    name: Staging · Push slugbase-web (GHCR dev)
    needs: [ci, plan, resolve-deploy-ref]
    if: >-
      needs.ci.result == 'success' &&
      needs.plan.outputs.push_ghcr_web == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ needs.resolve-deploy-ref.outputs.checkout_ref != '' && needs.resolve-deploy-ref.outputs.checkout_ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image (dev tag)
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          bash scripts/ci/build-push-ghcr.sh
          --target web
          ghcr.io/${{ format('{0}-web', github.repository) }}
          dev
          --no-latest
