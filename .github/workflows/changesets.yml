name: Changesets

# Changesets Version PR + per-package tagging on merge (spec §22.6, WP-7).
# Called from main.yml after CI passes.

on:
  workflow_call:
    outputs:
      published:
        description: Whether changesets publish (tag) ran on this push
        value: ${{ jobs.changesets.outputs.published }}
      published-packages:
        description: JSON array of published packages from changesets/action
        value: ${{ jobs.changesets.outputs.published-packages }}

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    name: Version packages
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Create Version PR or tag packages
        id: changesets
        uses: changesets/action@dafcd08ca059722e5ab7b05b4069899018ee94c8 # v1.4.10
        with:
          version: pnpm version-packages
          publish: pnpm tag-packages
          title: Version packages
          commit: Version packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
