# Playwright e2e tests — called from pr.yml for staging→main PRs,
# on workflow_dispatch, and via workflow_call (spec §22.4).
#
# Two jobs: cloud (separate API/web/marketing services) and
# ce (combined Docker image, single port).
#
# App under test uses explicit e2e env only (mirrors scripts/e2e.sh).

name: E2E

on:
  workflow_dispatch:

  workflow_call:
    inputs:
      mode:
        description: 'Deployment edition to test (cloud, ce, or empty for both)'
        required: true
        type: string

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  # Postgres (shared across editions)
  DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_e2e
  # E2E mode flag
  SLUGBASE_E2E_MODE: 'true'
  # Test credentials (created by seed fixture)
  E2E_TEST_EMAIL: e2e@slugbase.test
  E2E_TEST_PASSWORD: e2e-test-password

jobs:
  e2e-cloud:
    name: E2E · Cloud edition
    # Run on PR, workflow_dispatch, or workflow_call with matching mode
    if: >
      !cancelled() && (
        github.event_name != 'workflow_call'
        || inputs.mode == ''
        || inputs.mode == 'cloud'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci
    permissions:
      contents: read
    env:
      E2E_BASE_URL_API: http://localhost:4001
      E2E_BASE_URL_WEB: http://localhost:4002
      E2E_BASE_URL_MARKETING: http://localhost:4003
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build all packages (cloud edition)
        env:
          NODE_ENV: production
          SLUGBASE_EDITION: cloud
        run: pnpm build

      - name: Run DB migrations
        run: pnpm --filter @slugbase/backend db:migrate

      - name: Start API
        env:
          PORT: '4001'
          SLUGBASE_E2E_MODE: 'true'
          SLUGBASE_EDITION: cloud
          PUBLIC_REGISTRATION: 'true'
          # Cloud preset requires email verification; e2e registers without it.
          EMAIL_VERIFICATION_REQUIRED: 'false'
          SESSION_SECRET: 'ci-e2e-session-secret-at-least-32-chars-long!!'
          ENCRYPTION_KEY: 'ci-e2e-encryption-key-at-least-32-chars-long!!'
          APP_BASE_URL: http://localhost:4001
          FRONTEND_ORIGIN: http://localhost:4002
        run: |
          node packages/backend/dist/main.js >> cloud-services-api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Start Web (React Router serve)
        env:
          PORT: '4002'
          API_BASE_URL: http://localhost:4001
        run: |
          (cd packages/web && npx react-router-serve build/server/index.js) >> cloud-services-web.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Start Marketing (static serve)
        run: |
          npx serve packages/marketing/dist -l 4003 >> cloud-services-marketing.log 2>&1 &
          echo "MARKETING_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for health endpoints
        run: |
          echo "Waiting for API at $E2E_BASE_URL_API/health ..."
          api_ok=false
          for i in $(seq 1 30); do
            curl -sf "$E2E_BASE_URL_API/health" >/dev/null 2>&1 && { api_ok=true; break; }
            sleep 2
          done
          $api_ok || { echo "API did not become healthy"; exit 1; }
          echo "Waiting for Web at $E2E_BASE_URL_WEB/health ..."
          web_ok=false
          for i in $(seq 1 30); do
            curl -sf "$E2E_BASE_URL_WEB/health" >/dev/null 2>&1 && { web_ok=true; break; }
            sleep 2
          done
          $web_ok || { echo "Web did not become healthy"; exit 1; }
          echo "Waiting for Marketing at $E2E_BASE_URL_MARKETING ..."
          mktg_ok=false
          for i in $(seq 1 15); do
            curl -sf "$E2E_BASE_URL_MARKETING" >/dev/null 2>&1 && { mktg_ok=true; break; }
            sleep 2
          done
          $mktg_ok || { echo "Marketing did not become healthy"; exit 1; }

      - name: Run Playwright tests (cloud)
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_e2e
          E2E_BASE_URL_API: http://localhost:4001
          E2E_BASE_URL_WEB: http://localhost:4002
          E2E_BASE_URL_MARKETING: http://localhost:4003
        run: bash scripts/e2e-ci-playwright.sh cloud rp-e2e-cloud.log

      - name: Upload e2e debug logs (cloud)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-cloud-logs
          path: |
            rp-e2e-cloud.log
            cloud-services-api.log
            cloud-services-web.log
            cloud-services-marketing.log
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          # Stop backgrounded node/serve process trees (npx/react-router-serve spawn children)
          for pid in "${API_PID:-}" "${WEB_PID:-}" "${MARKETING_PID:-}"; do
            [ -n "$pid" ] || continue
            pkill -P "$pid" 2>/dev/null || true
            kill "$pid" 2>/dev/null || true
          done
          # Prune Docker build cache (keeps volumes intact for the job VM)
          docker builder prune --force 2>/dev/null || true

  e2e-ce:
    name: E2E · CE edition
    # Run on PR, workflow_dispatch, or workflow_call with matching mode
    if: >
      !cancelled() && (
        github.event_name != 'workflow_call'
        || inputs.mode == ''
        || inputs.mode == 'ce'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci
    permissions:
      contents: read
    env:
      E2E_BASE_URL_CE: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build combined image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: slugbase-e2e:ce
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SLUGBASE_EDITION=ce

      - name: Start combined container
        run: |
          docker run -d \
            --name slugbase-e2e-ce \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SLUGBASE_E2E_MODE=true \
            -e SLUGBASE_EDITION=ce \
            -e E2E_TEST_EMAIL="$E2E_TEST_EMAIL" \
            -e E2E_TEST_PASSWORD="$E2E_TEST_PASSWORD" \
            -e SESSION_SECRET='ci-e2e-session-secret-at-least-32-chars-long!!' \
            -e ENCRYPTION_KEY='ci-e2e-encryption-key-at-least-32-chars-long!!' \
            -e APP_BASE_URL='http://localhost:3000' \
            -e FRONTEND_ORIGIN='http://localhost:3000' \
            -e API_BASE_URL='http://localhost:3000' \
            -e PUBLIC_REGISTRATION=true \
            -e PORT=3000 \
            slugbase-e2e:ce

      - name: Wait for health endpoint
        run: |
          echo "Waiting for API at http://localhost:3000/health ..."
          ok=false
          for i in $(seq 1 30); do
            curl -sf "http://localhost:3000/health" >/dev/null 2>&1 && { ok=true; break; }
            sleep 2
          done
          $ok || { echo "CE container did not become healthy"; exit 1; }

      - name: Run Playwright tests (ce)
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_e2e
          E2E_BASE_URL_CE: http://localhost:3000
        run: bash scripts/e2e-ci-playwright.sh ce rp-e2e-ce.log

      - name: Upload e2e debug logs (ce)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-ce-logs
          path: rp-e2e-ce.log
          if-no-files-found: ignore

      - name: Cleanup — container
        if: always()
        run: |
          docker stop slugbase-e2e-ce 2>/dev/null || true
          docker rm slugbase-e2e-ce 2>/dev/null || true

      - name: Cleanup — builder prune
        if: always()
        run: docker builder prune --force 2>/dev/null || true
