name: E2E

# The browser journeys of doc 08 section 5.1 against the image built from this
# commit, started through compose.yml with the Mailpit of compose.e2e.yml that
# catches the mail of the stack, once on PostgreSQL 17 and once on 18 (doc 08
# section 6.2, Q3), each leg in four Playwright shards on runners of their own (doc 08
# section 5.1). The stack runs on the Docker daemon of the runner itself, as in
# the `build` job of ci.yml, with its ports published on 127.0.0.1; only the
# journeys run in a container, the Playwright image of e2e/Dockerfile (pinned to the
# version of @playwright/test and to a digest) with the host's network, so the job
# installs no browser and no system library from a package mirror (doc 08 section
# 6.1). A job of its own, `restore-drill`, runs the backup and restore drill of
# docs/self-hosting/backup-restore.md (e2e/restore-drill.spec.ts) on the same two
# majors: it dumps, destroys and restores the database of a stack that is its own, so
# it cannot share one with the shards, and it needs docker, which the Playwright image
# does not have, so it runs on the runner. A job of its own, `reverse-proxy`, runs the
# reverse proxy drill (e2e/reverse-proxy.spec.ts): the nginx file and the Caddyfile of
# docs/self-hosting/reverse-proxy.md, taken from the guide, in front of the image over https, and
# the cookie, origin and client-address behaviour that depends on them. It starts a stack of its
# own and proxies pinned by digest (e2e/compose.proxy.yml) on the runner's network, and what it
# proves does not depend on the PostgreSQL major, so it runs once. A job of its own, `upgrade-drill`, runs
# the upgrade drill (e2e/upgrade-drill.spec.ts): the published 1.0.0-rc.1 image, pinned by digest, started
# with seeded data and replaced by the image built here on the same database, by the steps of
# docs/self-hosting/upgrade.md; it runs on PostgreSQL 18 only, since the migration chain is proved on both
# majors elsewhere. No job references a secret, the workflow never runs on pull_request_target,
# and the secrets of the stack are generated per run by scripts/smoke-image.sh and
# never printed (doc 10 T16).

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  # One shard of one leg: a runner of its own with its own stack, so the shards of a
  # leg share neither the database, the mail, the sign-in limits of the stack's client
  # address (doc 04 section 7) nor the session files under e2e/.auth. A failing shard
  # stops no other, so every shard and both majors report.
  shards:
    name: e2e shard (PostgreSQL ${{ matrix.postgres }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
        # --shard=<n>/4 below: the four have to agree.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: e2e
      # Built here and not pushed; the commit is passed in so that /version reports
      # the commit under test.
      - name: Build the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/slugbase/Dockerfile --build-arg "BUILD_COMMIT=$BUILD_COMMIT" -t slugbase:e2e .
      # The journeys import workspace packages (@slugbase/testing for their fixtures)
      # whose exports point at dist/, and the Docker build above produces no dist/ on
      # the runner. The filter builds what @slugbase/e2e depends on, and what those
      # depend on, so a journey that imports another package is covered without a
      # change here; the Playwright image sees the output because in-image.sh mounts
      # the checkout at its own path.
      - name: Build the workspace packages the journeys import
        run: pnpm turbo run build --filter='@slugbase/e2e^...'
      # The browsers and the system libraries they need, for the three projects of
      # e2e/playwright.config.ts, come with the image the journeys run in.
      - name: Pull the Playwright image
        run: bash e2e/in-image.sh --pull
      # with-stack.sh starts the stack on the PostgreSQL major of the leg (it fails
      # when the database reports another), runs the command against it and removes
      # the project, its volume and its temporary files however the command ends.
      # The journeys run in the Playwright image on the network of the runner
      # (e2e/in-image.sh), as the user of the runner, so that what they write under
      # e2e/ is readable by the upload step. The step fails when a test does. --shard
      # splits the tests of all projects by count, in project order, so each test runs in
      # one shard of a leg; the `setup` project, which the other projects depend on, runs
      # in each shard against its stack.
      - name: Run the journeys
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SLUGBASE_IMAGE: slugbase:e2e
          SMOKE_POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: bash e2e/with-stack.sh bash e2e/in-image.sh node run-tests.ts --shard=${{ matrix.shard }}/4
      # A stack that the script could not remove (its process killed, say) is removed
      # here; a run that ended normally leaves nothing to find.
      - name: Remove any stack left behind
        if: ${{ always() }}
        run: |
          set -euo pipefail
          docker ps --all --format '{{.ID}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker rm --force --volumes
          docker volume ls --quiet --filter 'label=com.docker.compose.project' --format '{{.Name}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker volume rm --force
      # Traces, videos and screenshots of the failed tests, and the HTML report.
      - name: Upload the artifacts of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts-postgres-${{ matrix.postgres }}-shard-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The drill of docs/self-hosting/backup-restore.md on the image built from this commit, once
  # per PostgreSQL major, so that the guide's commands (dump, recreate, roles, restore) are
  # proven against the database of each major the images support (doc 08 section 6.2, Q3).
  # The drill starts the stack of its own (e2e/restore-drill-stack.sh, a compose project of the
  # same kind as the shards') and removes it however it ends. It uses the HTTP API and docker
  # compose alone, so no browser and no Playwright image are needed here.
  restore-drill:
    name: restore drill (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: e2e-restore-drill
      - name: Build the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/slugbase/Dockerfile --build-arg "BUILD_COMMIT=$BUILD_COMMIT" -t slugbase:e2e .
      # The step fails when the drill does, and so does the check of the leg.
      - name: Run the restore drill
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SLUGBASE_IMAGE: slugbase:e2e
          SMOKE_POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: pnpm --filter @slugbase/e2e test:e2e restore-drill
      - name: Remove any stack left behind
        if: ${{ always() }}
        run: |
          set -euo pipefail
          docker ps --all --format '{{.ID}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker rm --force --volumes
          docker volume ls --quiet --filter 'label=com.docker.compose.project' --format '{{.Name}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker volume rm --force
      - name: Upload the artifacts of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-drill-artifacts-postgres-${{ matrix.postgres }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The reverse proxy drill of docs/self-hosting/reverse-proxy.md on the image built from this commit
  # (doc 08 section 5.1, doc 10 T4, T5 and T9). The nginx and the Caddy file are read from the guide on
  # every run, so a change to the guide that breaks one of them, or that no longer says what the drill
  # sees, fails this job. The proxies are containers on the host's network, started by the drill from
  # the images pinned by digest in e2e/compose.proxy.yml, so each client has an address of its own as
  # the proxy sees it; the drill removes them, and its stack, however it ends. It uses the HTTP API,
  # docker and docker compose alone, so no browser and no Playwright image are needed here.
  reverse-proxy:
    name: reverse proxy drill
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: e2e-reverse-proxy
      - name: Build the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/slugbase/Dockerfile --build-arg "BUILD_COMMIT=$BUILD_COMMIT" -t slugbase:e2e .
      # The step fails when the drill does, and so does the check of the leg.
      - name: Run the reverse proxy drill
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SLUGBASE_IMAGE: slugbase:e2e
        run: pnpm --filter @slugbase/e2e test:e2e reverse-proxy
      # A stack or a proxy that the drill could not remove (its process killed, say) is removed here.
      - name: Remove any stack or proxy left behind
        if: ${{ always() }}
        run: |
          set -euo pipefail
          docker ps --all --format '{{.ID}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker rm --force --volumes
          docker ps --all --quiet --filter 'label=slugbase-e2e-proxy' |
            xargs --no-run-if-empty docker rm --force --volumes
          docker volume ls --quiet --filter 'label=com.docker.compose.project' --format '{{.Name}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker volume rm --force
      - name: Upload the artifacts of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reverse-proxy-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The upgrade drill of docs/self-hosting/upgrade.md (doc 08 section 5.1, D25, Q52): a stack of its own on the
  # published release candidate image, pulled anonymously and pinned by digest, is seeded through the API and then
  # moved to the image built from this commit on the same database, once by `docker compose up -d` and once with
  # the migration run by hand. The registry is public, so the job holds no credential and logs in to nothing. The
  # drill removes its stacks however it ends. It uses the HTTP API and docker compose alone, so no browser and no
  # Playwright image are needed here.
  upgrade-drill:
    name: upgrade drill
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: e2e-upgrade-drill
      - name: Build the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/slugbase/Dockerfile --build-arg "BUILD_COMMIT=$BUILD_COMMIT" -t slugbase:e2e .
      # The step fails when the drill does, and so does the check of the leg.
      - name: Run the upgrade drill
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SLUGBASE_IMAGE: slugbase:e2e
        run: pnpm --filter @slugbase/e2e test:e2e upgrade-drill
      - name: Remove any stack left behind
        if: ${{ always() }}
        run: |
          set -euo pipefail
          docker ps --all --format '{{.ID}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker rm --force --volumes
          docker volume ls --quiet --filter 'label=com.docker.compose.project' --format '{{.Name}} {{.Label "com.docker.compose.project"}}' |
            awk '$2 ~ /^slugbase-smoke-/ { print $1 }' |
            xargs --no-run-if-empty docker volume rm --force
      - name: Upload the artifacts of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-drill-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The check each leg has always reported, which the ruleset of `main` requires by
  # name ("e2e (PostgreSQL 17)", "e2e (PostgreSQL 18)"). It fails unless every shard,
  # every restore drill, the reverse proxy drill and the upgrade drill succeeded: a failed, cancelled or skipped job is not a pass,
  # and `needs` waits for the jobs of both legs, so one failing job fails the check of both.
  e2e:
    name: e2e (PostgreSQL ${{ matrix.postgres }})
    needs: [shards, restore-drill, reverse-proxy, upgrade-drill]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        postgres: ["17", "18"]
    steps:
      - name: Require every shard and every drill to have succeeded
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
          RESTORE_DRILL_RESULT: ${{ needs.restore-drill.result }}
          REVERSE_PROXY_RESULT: ${{ needs.reverse-proxy.result }}
          UPGRADE_DRILL_RESULT: ${{ needs.upgrade-drill.result }}
        run: |
          set -euo pipefail
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "the e2e shards ended '$SHARDS_RESULT', not 'success'" >&2
            exit 1
          fi
          if [[ "$RESTORE_DRILL_RESULT" != "success" ]]; then
            echo "the restore drill ended '$RESTORE_DRILL_RESULT', not 'success'" >&2
            exit 1
          fi
          if [[ "$REVERSE_PROXY_RESULT" != "success" ]]; then
            echo "the reverse proxy drill ended '$REVERSE_PROXY_RESULT', not 'success'" >&2
            exit 1
          fi
          if [[ "$UPGRADE_DRILL_RESULT" != "success" ]]; then
            echo "the upgrade drill ended '$UPGRADE_DRILL_RESULT', not 'success'" >&2
            exit 1
          fi
