name: Prepare Release

# Draft GitHub Release after Changesets publish and api/web production deploy (spec §22.6, §22.8).
# Per-package git tags are created by changeset tag in changesets.yml.

on:
  workflow_call:
    inputs:
      published-packages:
        description: JSON array of published packages from changesets/action
        type: string
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Release · Prepare draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Verify translations
        run: pnpm i18n:validate

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ inputs.published-packages }}
        run: node scripts/ci/create-draft-release.mjs
