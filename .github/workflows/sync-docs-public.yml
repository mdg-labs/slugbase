name: Sync Public Docs

# Flat mirror docs/public/ → mdg-labs/slugbase-docs main on push to main (spec §22, #392/#396).
# Documentation.AI rebuilds when slugbase-docs main updates.

on:
  push:
    branches: [main]
    paths:
      - 'docs/public/**'

permissions:
  contents: read

concurrency:
  group: sync-docs-public
  cancel-in-progress: false

jobs:
  sync:
    name: Docs · Sync to slugbase-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout slugbase
        uses: actions/checkout@v6

      - name: Verify deploy key secret
        env:
          DEPLOY_KEY: ${{ secrets.SLUGBASE_DOCS_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::GitHub secret SLUGBASE_DOCS_DEPLOY_KEY is not configured."
            echo "See docs/internal/sync-docs-public-runbook.md for setup."
            exit 1
          fi

      - name: Configure SSH for slugbase-docs
        uses: webfactory/ssh-agent@d4770aba3bc7d7ee9a2d351d76aced3bbcdb3f71 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SLUGBASE_DOCS_DEPLOY_KEY }}

      - name: Trust github.com host key
        run: ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts"

      - name: Clone slugbase-docs
        run: git clone --depth 1 --branch main git@github.com:mdg-labs/slugbase-docs.git slugbase-docs

      - name: Mirror docs/public to slugbase-docs root
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.git/**' \
            docs/public/ slugbase-docs/

      - name: Commit and push if changed
        working-directory: slugbase-docs
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish — slugbase-docs already matches docs/public/"
            exit 0
          fi
          git commit -m "sync from ${SOURCE_REPO}@${SOURCE_SHA}

          Source: https://github.com/${SOURCE_REPO}/commit/${SOURCE_SHA}"
          git push origin main
