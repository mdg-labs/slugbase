name: CI

# Reusable CI gate — lint, typecheck, unit, build, integration, audit (parallel jobs).
# Called by pr.yml, staging.yml, and main.yml; never triggered directly (spec §22.4).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: CI · Lint
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Lint
        run: pnpm lint

  typecheck:
    name: CI · Typecheck
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: CI · Unit tests
    runs-on: ubuntu-latest
    environment: ci
    env:
      REPORTPORTAL_URL: ${{ secrets.REPORTPORTAL_URL }}
      REPORTPORTAL_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
      REPORTPORTAL_PROJECT: ${{ secrets.REPORTPORTAL_PROJECT }}
      # Unit tests must not call the live API.
      PUBLIC_API_BASE_URL: ""
      API_BASE_URL: ""
      VITE_API_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Check ReportPortal configuration
        run: |
          missing=()
          [ -z "${REPORTPORTAL_URL:-}" ] && missing+=("REPORTPORTAL_URL")
          [ -z "${REPORTPORTAL_PROJECT:-}" ] && missing+=("REPORTPORTAL_PROJECT")
          [ -z "${REPORTPORTAL_API_KEY:-}" ] && missing+=("REPORTPORTAL_API_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::ReportPortal disabled — unset: ${missing[*]} (set in GHA ci environment secrets)"
          else
            echo "ReportPortal configuration present"
          fi

      - name: Start ReportPortal unit launch
        id: rp-unit-start
        run: |
          uuid=$(node --experimental-strip-types scripts/reportportal-ci-launch.ts start unit || true)
          echo "launch_id=${uuid}" >> "$GITHUB_OUTPUT"
          if [ -n "$uuid" ]; then
            echo "RP_LAUNCH_ID=${uuid}" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        id: unit-tests
        run: pnpm test:unit

      - name: Script tests
        run: pnpm test:scripts

      - name: i18n catalog validation
        run: pnpm run i18n:validate

      - name: Hard-coded UI strings (rg)
        run: pnpm run i18n:check:hardcoded

      - name: Client API origin guard
        run: pnpm run check:client-api-origin

      - name: External font CDN guard
        run: pnpm run check:no-external-fonts

      - name: Finish ReportPortal unit launch
        if: always() && steps.rp-unit-start.outputs.launch_id != ''
        env:
          RP_LAUNCH_STATUS: ${{ steps.unit-tests.outcome == 'success' && 'PASSED' || 'FAILED' }}
        run: |
          node --experimental-strip-types scripts/reportportal-ci-launch.ts finish unit \
            "${{ steps.rp-unit-start.outputs.launch_id }}" \
            "$RP_LAUNCH_STATUS"

      - name: Record ReportPortal unit launch
        if: always() && steps.rp-unit-start.outputs.launch_id != ''
        env:
          RP_LAUNCH_UUID: ${{ steps.rp-unit-start.outputs.launch_id }}
        run: bash scripts/reportportal-ci-summary.sh record-env unit

      - name: Upload ReportPortal launch state
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reportportal-ci-launches
          path: reportportal-launches.jsonl
          if-no-files-found: ignore

  build:
    name: CI · Build
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Validate blog content
        run: pnpm blog:validate

      - name: Build
        env:
          NODE_ENV: production
          SLUGBASE_EDITION: cloud
        run: pnpm build

      - name: Validate sync-secrets manifest
        run: node --experimental-strip-types scripts/validate-sync-secrets-manifest.ts

      - name: Validate workflow secrets policy
        run: node --experimental-strip-types scripts/validate-workflow-secrets-policy.ts

  integration:
    name: CI · Integration tests
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    environment: ci
    env:
      REPORTPORTAL_URL: ${{ secrets.REPORTPORTAL_URL }}
      REPORTPORTAL_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
      REPORTPORTAL_PROJECT: ${{ secrets.REPORTPORTAL_PROJECT }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Start ReportPortal integration launch
        id: rp-integration-start
        run: |
          uuid=$(node --experimental-strip-types scripts/reportportal-ci-launch.ts start integration || true)
          echo "launch_id=${uuid}" >> "$GITHUB_OUTPUT"
          if [ -n "$uuid" ]; then
            echo "RP_LAUNCH_ID=${uuid}" >> "$GITHUB_ENV"
          fi

      - name: Apply integration test migrations
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
        run: |
          bash scripts/ci/run-migrate.sh
          bash scripts/ci/run-migrate-admin.sh

      - name: Integration tests
        id: integration-tests
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
          SLUGBASE_INTEGRATION_NO_DOCKER: "1"
          PUBLIC_API_BASE_URL: ""
        run: pnpm test:integration

      - name: Finish ReportPortal integration launch
        if: always() && steps.rp-integration-start.outputs.launch_id != ''
        env:
          RP_LAUNCH_STATUS: ${{ steps.integration-tests.outcome == 'success' && 'PASSED' || 'FAILED' }}
        run: |
          node --experimental-strip-types scripts/reportportal-ci-launch.ts finish integration \
            "${{ steps.rp-integration-start.outputs.launch_id }}" \
            "$RP_LAUNCH_STATUS"

      - name: Record ReportPortal integration launch
        if: always() && steps.rp-integration-start.outputs.launch_id != ''
        env:
          RP_LAUNCH_UUID: ${{ steps.rp-integration-start.outputs.launch_id }}
        run: bash scripts/reportportal-ci-summary.sh record-env integration

      - name: Upload ReportPortal launch state
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reportportal-ci-launches
          path: reportportal-launches.jsonl
          if-no-files-found: ignore

  audit:
    name: CI · Audit
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  reportportal-summary:
    name: CI · ReportPortal summary
    needs: [lint, typecheck, unit, build, integration, audit]
    if: always()
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      pull-requests: write
    env:
      REPORTPORTAL_SUMMARY_URL: ${{ secrets.REPORTPORTAL_URL }}
      REPORTPORTAL_SUMMARY_PROJECT: ${{ secrets.REPORTPORTAL_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Download ReportPortal launch state
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        continue-on-error: true
        with:
          name: reportportal-ci-launches
          merge-multiple: true

      - name: ReportPortal job summary
        if: always()
        run: bash scripts/reportportal-ci-summary.sh write-summary ci

      - name: ReportPortal PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/reportportal-ci-summary.sh update-pr-comment ci

      - name: ReportPortal summary pointer
        if: always()
        run: echo 'ReportPortal launch links are in this job summary.' >> "$GITHUB_STEP_SUMMARY"
