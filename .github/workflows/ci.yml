name: CI

# CI checks — runs on PRs and pushes to staging/main (spec §22.4).

on:
  pull_request:
    branches: [staging, main]

  push:
    branches: [staging, main]

  workflow_dispatch:

permissions:
  contents: write    # prepare-release needs write for tags + releases
  id-token: write    # Infisical OIDC (deploy-staging reusable workflow)
  packages: write    # GHCR push (deploy-staging reusable workflow)
  pull-requests: write  # ReportPortal PR summary comments

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI · Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: staging

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          set -o pipefail
          pnpm test:unit 2>&1 | tee /tmp/rp-unit.log

      - name: Record ReportPortal unit launches
        if: always()
        run: bash scripts/reportportal-ci-summary.sh record-log unit /tmp/rp-unit.log

      - name: i18n catalog validation
        run: pnpm run i18n:validate

      - name: Hard-coded UI strings (rg)
        run: pnpm run i18n:check:hardcoded

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
          SLUGBASE_INTEGRATION_NO_DOCKER: "1"
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee /tmp/rp-integration.log

      - name: Record ReportPortal integration launches
        if: always()
        run: bash scripts/reportportal-ci-summary.sh record-log integration /tmp/rp-integration.log

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: ReportPortal job summary
        if: always()
        run: bash scripts/reportportal-ci-summary.sh write-summary ci

      - name: ReportPortal PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/reportportal-ci-summary.sh update-pr-comment ci

      - name: Upload ReportPortal launch state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportportal-ci-launches
          path: reportportal-launches.jsonl
          if-no-files-found: ignore

  deploy-staging:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging'
    needs: ci
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  prepare-release:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: ci
    uses: ./.github/workflows/prepare-release.yml
    secrets: inherit
