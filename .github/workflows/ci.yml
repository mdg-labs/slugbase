name: CI

# CI checks — runs on PRs and pushes to staging/main (spec §22.4).

on:
  pull_request:
    branches: [staging, main]

  push:
    branches: [staging, main]

  workflow_dispatch:

permissions:
  contents: write    # prepare-release needs write for tags + releases
  id-token: write    # Infisical OIDC (deploy-staging reusable workflow)
  packages: write    # GHCR push (deploy-staging reusable workflow)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI · Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: i18n catalog validation
        run: pnpm run i18n:validate

      - name: Hard-coded UI strings (rg)
        run: pnpm run i18n:check:hardcoded

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
          SLUGBASE_INTEGRATION_NO_DOCKER: "1"
        run: pnpm test:integration

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ci
          path: |
            allure-results/unit
            allure-results/integration
          if-no-files-found: ignore

  publish-allure:
    name: CI · Publish Allure report
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: allure-pages
      cancel-in-progress: false
    steps:
      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-ci
          path: allure-results

      - name: Checkout GitHub Pages with previous Allure reports
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Generate Allure test report
        id: allure-report
        if: always()
        uses: andgineer/allure-report@v3.8
        with:
          allure-results: allure-results
          website: gh-pages-dir
          reports-site-path: test-reports
          website-url: https://mdg-labs.github.io/slugbase

      - name: Publish Allure test report
        if: always() && steps.allure-report.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ steps.allure-report.outputs.reports-site }}
          destination_dir: ${{ steps.allure-report.outputs.reports-site-path }}

      - name: Find existing Allure PR comment
        if: always() && github.event_name == 'pull_request' && steps.allure-report.outputs.report-url != ''
        id: find-allure-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ci-allure-report -->'

      - name: Comment Allure report link on PR
        if: always() && github.event_name == 'pull_request' && steps.allure-report.outputs.report-url != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-allure-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            <!-- ci-allure-report -->
            ## CI Allure report

            [View test report](${{ steps.allure-report.outputs.report-url }})

  deploy-staging:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/staging'
    needs: ci
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit

  prepare-release:
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    needs: ci
    uses: ./.github/workflows/prepare-release.yml
    secrets: inherit
