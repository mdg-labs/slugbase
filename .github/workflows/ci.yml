name: CI

# Reusable CI gate — lint, typecheck, unit, build, integration, audit (parallel jobs).
# Called by pr.yml, staging.yml, and main.yml; never triggered directly (spec §22.4).

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: CI · Lint
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Lint
        run: pnpm lint

  typecheck:
    name: CI · Typecheck
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: CI · Unit tests
    runs-on: ubuntu-latest
    environment: ci
    env:
      # Unit tests must not call the live API.
      PUBLIC_API_BASE_URL: ""
      API_BASE_URL: ""
      VITE_API_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Unit tests
        run: pnpm test:unit

      - name: Script tests
        run: pnpm test:scripts

      - name: i18n catalog validation
        run: pnpm run i18n:validate

      - name: Hard-coded UI strings (rg)
        run: pnpm run i18n:check:hardcoded

      - name: Client API origin guard
        run: pnpm run check:client-api-origin

      - name: External font CDN guard
        run: pnpm run check:no-external-fonts

  build:
    name: CI · Build
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Validate blog content
        run: pnpm blog:validate

      - name: Build
        env:
          NODE_ENV: production
          SLUGBASE_EDITION: cloud
        run: pnpm build

      - name: Validate deploy workflow secrets policy
        run: node --experimental-strip-types scripts/validate-deploy-workflow-secrets.ts

  integration:
    name: CI · Integration tests
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    environment: ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Apply integration test migrations
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
        run: |
          bash scripts/ci/run-migrate.sh
          bash scripts/ci/run-migrate-admin.sh

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
          SLUGBASE_INTEGRATION_NO_DOCKER: "1"
          PUBLIC_API_BASE_URL: ""
        run: pnpm test:integration

  audit:
    name: CI · Audit
    needs: typecheck
    if: needs.typecheck.result == 'success'
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Dependency audit
        run: pnpm audit --audit-level=high
