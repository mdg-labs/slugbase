name: CI

# The jobs of doc 08 §6.2 run in parallel, each inside node:24-bookworm with
# the same setup, so the file can move to other runners unchanged (doc 08
# §6.1); `build`, `image-scan` and `integration-pooled` are the exceptions,
# because they need Docker (see there). No job references a secret, and the workflow never runs on
# pull_request_target, so a run for a fork pull request holds nothing but a
# read-only token (doc 10 T16). Job names are required by branch protection;
# rename one only together with that rule.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A step in a container job defaults to sh, which is dash in node:24-bookworm
# and rejects `set -o pipefail`; every step runs under bash instead.
defaults:
  run:
    shell: bash

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      # Before the install: it fetches each package from where the lockfile says.
      - run: bash scripts/check-lockfile-sources.sh
      # The test of the image scan (scripts/scan-image.test.sh, part of pnpm lint)
      # reads JSON with jq, which node:24-bookworm does not carry.
      - name: Install jq
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends jq
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: lint
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: typecheck
      - run: pnpm typecheck

  # The unit suites run as four shards, each on a runner of its own with the
  # runner's 4 CPUs to itself. As one job they took 10 to 14 minutes uncached
  # against the 15-minute bound (run 42664227288: 14m13s): the packages' tasks
  # shared the 4 CPUs under the two-task cap below, and `@slugbase/web` alone ran
  # 542 s (106 files) on two vitest workers, the last task to start. Web is split
  # in two with vitest's `--shard`, each half on 4 workers; `db` and `ui`, the
  # next two, run side by side; every other package is named by exclusion, so
  # that a new package is tested by `rest` without an edit here. Each shard keeps
  # the cap that issue 568 set: at most two package tasks of two vitest workers
  # each, or one task of four, so the busy workers never exceed the 4 CPUs.
  # turbo.json passes VITEST_MAX_WORKERS through to the tasks. Measured on 4 CPUs
  # (taskset), the shards take 0.5 to 0.6 of the time of the one job (see the
  # commit that introduced them); when the slowest shard of a run on `dev`
  # takes more than 7 minutes, split it again here.
  unit-shard:
    name: unit-shard (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: web-1
            args: --filter=@slugbase/web -- --shard=1/2
            workers: 4
          - group: web-2
            args: --filter=@slugbase/web -- --shard=2/2
            workers: 4
          - group: db-ui
            args: --filter=@slugbase/db --filter=@slugbase/ui
            workers: 2
          - group: rest
            args: --filter=!@slugbase/web --filter=!@slugbase/db --filter=!@slugbase/ui
            workers: 2
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: unit-${{ matrix.group }}
      - name: Run the unit suites of the shard
        env:
          VITEST_MAX_WORKERS: ${{ matrix.workers }}
          TURBO_ARGS: ${{ matrix.args }}
        run: |
          read -r -a args <<< "$TURBO_ARGS"
          pnpm test:unit --concurrency=2 "${args[@]}"

  # Branch protection requires a check named `unit`; this job is that check and
  # passes only when every shard did, so a shard that fails, is cancelled or is
  # skipped fails it.
  unit:
    name: unit
    needs: unit-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every unit shard to pass
        env:
          SHARDS_RESULT: ${{ needs.unit-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "The unit shards finished as: $SHARDS_RESULT" >&2
            exit 1
          fi

  # The breaking-change check compares /api/v1 with the document at the latest
  # release tag reachable from main (doc 04 §1.1), so the checkout fetches the
  # full history and every tag and branch; the script fails on a shallow clone.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    env:
      OASDIFF_VERSION: v1.33.0
      OASDIFF_SHA256_AMD64: 43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247
      OASDIFF_SHA256_ARM64: 4ae3c362d6074d919aada2dea82d0ee84366591600384455d0bdc658ddf8f7ae
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: contracts
      - run: pnpm contracts:check
      - run: pnpm i18n:check
      - name: Install oasdiff
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$OASDIFF_SHA256_AMD64" ;;
            aarch64) arch=arm64; sha="$OASDIFF_SHA256_ARM64" ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/oasdiff"
          archive="$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION#v}_linux_${arch}.tar.gz"
          echo "${sha}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$dir" oasdiff
          "$dir/oasdiff" --version
          echo "$dir" >> "$GITHUB_PATH"
      - name: Test the breaking-change check
        run: bash scripts/check-openapi-breaking.test.sh
      - name: Check /api/v1 for breaking changes
        run: bash scripts/check-openapi-breaking.sh

  # The docs contract (doc 09 section 3.5) is checked only for a change that can
  # alter its verdict: the three content roots, the checker in scripts/docs-check
  # and the lockfile that pins the checker's dependencies. The job itself always runs and succeeds without
  # checking when nothing there changed, so it can be a required status check
  # (doc 08 section 6.2). When the changed files cannot be determined (no base
  # commit, a base the checkout does not hold) the check runs.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find out whether the documentation changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          changed=true
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No base commit to compare with; the check runs."
          elif ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "Base commit ${BASE_SHA} is not in the checkout; the check runs."
          else
            rc=0
            git diff --quiet "$BASE_SHA" HEAD -- docs/user docs/self-hosting docs/releases scripts/docs-check pnpm-lock.yaml || rc=$?
            case "$rc" in
              0) changed=false; echo "Nothing under docs/user, docs/self-hosting, docs/releases or scripts/docs-check changed, and neither did pnpm-lock.yaml; the check is skipped." ;;
              1) echo "The documentation, its checker or the lockfile changed; the check runs." ;;
              *) echo "git diff failed (exit ${rc})" >&2; exit 1 ;;
            esac
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        if: steps.changed.outputs.changed == 'true'
        with:
          turbo-cache-key: docs
      - name: Check the documentation
        if: steps.changed.outputs.changed == 'true'
        run: pnpm docs:check

  integration:
    name: integration (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: node:24-bookworm
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: slugbase_ci
          POSTGRES_PASSWORD: slugbase_ci
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U slugbase_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Catches the mail the SMTP adapter's integration test sends (doc 08
      # section 1.2); the test reaches it by the service name `mailpit`, on its
      # SMTP port 1025 and its HTTP API on 8025.
      mailpit:
        image: axllent/mailpit:v1.31.5
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SLUGBASE_TEST_PG_URL: postgres://slugbase_ci:slugbase_ci@postgres:5432/postgres
    steps:
      # The expand/contract check of `pnpm db:check` compares the migrations with
      # the latest release tag, so the checkout fetches the full history and
      # every tag; the check fails on a shallow clone.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: integration-${{ matrix.postgres }}
      - name: Install the PostgreSQL client
        run: |
          apt-get update
          apt-get install -y --no-install-recommends postgresql-client
      # The migration check reads nothing from the event: a contract migration
      # passes on its generated contract header alone, on a push and on a pull
      # request (Q52), and the maintainer approves it by merging the pull request.
      # The db package's integration tests run `pnpm db:check` themselves.
      - run: pnpm db:check
      - run: pnpm test:integration

  # The tenant context behind PgBouncer in transaction mode with a server pool of
  # one connection (doc 08 §3.2, T1). On the runner like `build`: the Postgres of
  # compose.dev.yml and the PgBouncer in front of it (its `pooler` profile) start
  # on the runner's own Docker daemon, which the node container does not have.
  # `pnpm test:integration:pooled` starts them, builds what the three test files
  # import and runs the files with SLUGBASE_TEST_POOLER_URL set; the harness
  # fails a file whose database the pooler does not serve.
  integration-pooled:
    name: integration-pooled
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: integration-pooled
      - name: Run the tenancy tests through PgBouncer
        run: pnpm test:integration:pooled
      - name: Remove the services
        if: always()
        run: docker compose -f compose.dev.yml --profile pooler down --volumes

  # One of the two jobs that are not in the node container (`image-scan` is the
  # other): it builds the image and starts it with Docker Compose
  # (scripts/smoke-image.sh), which needs the runner's own
  # Docker daemon and its published ports. Node comes from setup-node instead, at
  # the major version of .nvmrc, and the same setup action installs the workspace.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: build
      - run: pnpm build
      # compose-cli.integration.test.ts runs only where the docker CLI with the
      # compose plugin is present, and the integration job's container has neither;
      # here they must run, so a skipped or failed case fails the step.
      - name: Test compose.yml under Docker Compose
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/compose-cli.json"
          pnpm --filter slugbase exec vitest run --project integration compose-cli \
            --reporter=default --reporter=json --outputFile.json="$report"
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numPendingTests == 0 and .numTodoTests == 0' "$report" > /dev/null
      # roles-statistics.integration.test.ts starts Postgres containers of its own
      # (a first start with and without the pg_stat_statements preload), which a
      # service container of the integration job cannot do; a skipped case fails
      # the step, and the test removes its containers and volumes itself.
      - name: Test role provisioning against the statistics views
        env:
          SLUGBASE_TEST_ROLES_STATISTICS: "1"
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/roles-statistics.json"
          pnpm --filter @slugbase/db exec vitest run --project integration roles-statistics \
            --reporter=default --reporter=json --outputFile.json="$report"
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests and .numPendingTests == 0 and .numTodoTests == 0' "$report" > /dev/null
      - name: Test the smoke script
        run: bash scripts/smoke-image.test.sh
      # Built here and not pushed (doc 08 §6.2); the script takes it by name. The
      # commit is passed in so that /version must report the commit under test.
      - name: Build the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/slugbase/Dockerfile --build-arg "BUILD_COMMIT=$BUILD_COMMIT" -t slugbase:ci .
      - name: Smoke-test the image
        env:
          BUILD_COMMIT: ${{ github.sha }}
          SLUGBASE_IMAGE: slugbase:ci
        run: bash scripts/smoke-image.sh

  # The image's own packages, which the lockfile audit below does not see (doc 08
  # §6.2). The image is built with BuildKit's SPDX SBOM, which needs the container
  # driver, so the job runs on the runner like `build`. It holds no secret.
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      # Before the image build: it fetches each package from where the lockfile says.
      - name: Check the lockfile sources
        run: bash scripts/check-lockfile-sources.sh
      - name: Install the scanner
        run: |
          set -euo pipefail
          bash scripts/scan-image.sh --install "$RUNNER_TEMP/osv-scanner"
          echo "OSV_SCANNER=$RUNNER_TEMP/osv-scanner/osv-scanner" >> "$GITHUB_ENV"
      # A scanner that reads nothing would pass every image: each fixture SBOM names
      # a package version with a known advisory, one from npm and one from Debian
      # in the form BuildKit writes it, and the scan fails without the finding.
      - name: Check the scanner reports a known vulnerability
        run: |
          set -euo pipefail
          bash scripts/scan-image.sh --canary scripts/fixtures/image-scan/canary.spdx.json
          bash scripts/scan-image.sh --canary scripts/fixtures/image-scan/canary-debian.spdx.json
      # The builder and the SBOM generator are named by digest, as in release.yml;
      # Renovate keeps the tags and digests current.
      - name: Create the builder
        run: |
          docker buildx create --name image-scan --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe \
            --use
      - name: Build the image and its SBOM
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file apps/slugbase/Dockerfile \
            --build-arg "BUILD_COMMIT=$BUILD_COMMIT" \
            --sbom=generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 \
            --output "type=local,dest=$RUNNER_TEMP/image" \
            .
      - name: Scan the SBOM
        run: bash scripts/scan-image.sh "$RUNNER_TEMP/image/sbom.spdx.json"

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-bookworm
    env:
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256_AMD64: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
      OSV_SCANNER_SHA256_ARM64: 2c71403eb443d05891c4f268c3ad771cf4f16e5443463fd7851ef8f454d3c7e4
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-key: audit
      - run: pnpm audit --audit-level=high
      - name: OSV scan of pnpm-lock.yaml
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) arch=amd64; sha="$OSV_SCANNER_SHA256_AMD64" ;;
            aarch64) arch=arm64; sha="$OSV_SCANNER_SHA256_ARM64" ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          bin="$RUNNER_TEMP/osv-scanner"
          curl -fsSL --retry 3 -o "$bin" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_${arch}"
          echo "${sha}  ${bin}" | sha256sum --check --strict -
          chmod +x "$bin"
          "$bin" scan source --lockfile pnpm-lock.yaml
