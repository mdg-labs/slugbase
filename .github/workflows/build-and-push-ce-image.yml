name: Build and Push CE Image

# Reusable GHCR publish for CE split images (api + web only; spec §22.8).
# workflow_call only — invoked from staging.yml, release.yml, etc.

on:
  workflow_call:
    inputs:
      service:
        description: CE image surface (api or web)
        type: string
        required: true
      tags:
        description: Newline-separated image tag suffixes (e.g. dev, 1.0.0, latest)
        type: string
        required: true
      ref:
        description: Optional checkout ref (empty uses github.sha)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  push:
    name: CE · Push slugbase-${{ inputs.service }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate service
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            api|web) ;;
            *)
              echo "::error::Invalid service '${SERVICE}' — expected api or web"
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CE image
        env:
          SERVICE: ${{ inputs.service }}
          TAGS: ${{ inputs.tags }}
          IMAGE: ghcr.io/${{ format('{0}-{1}', github.repository, inputs.service) }}
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          primary=""
          push_latest=false
          while IFS= read -r suffix || [[ -n "$suffix" ]]; do
            suffix="${suffix//$'\r'/}"
            [[ -z "$suffix" ]] && continue
            if [[ "$suffix" == "latest" ]]; then
              push_latest=true
            elif [[ -z "$primary" ]]; then
              primary="$suffix"
            fi
          done <<< "$TAGS"

          if [[ -z "$primary" ]]; then
            echo "::error::No primary tag in tags input"
            exit 1
          fi

          args=(--target "$SERVICE" "$IMAGE" "$primary")
          if [[ "$push_latest" == "true" ]]; then
            args+=(--latest)
          else
            args+=(--no-latest)
          fi

          bash scripts/ci/build-push-ghcr.sh "${args[@]}"
