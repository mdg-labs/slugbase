name: Release

# Published release — production deploy (no CI gate) and GHCR image push (spec §22.7–22.8).

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      force_full_deploy:
        description: Deploy all surfaces regardless of change detection
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check-not-deployed:
    name: Production · 0 · Check deploy needed
    runs-on: ubuntu-latest
    environment: production
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      deploy_api_needed: ${{ steps.check.outputs.deploy_api_needed }}
      deploy_web_needed: ${{ steps.check.outputs.deploy_web_needed }}
      deploy_marketing_needed: ${{ steps.check.outputs.deploy_marketing_needed }}
      deploy_admin_needed: ${{ steps.check.outputs.deploy_admin_needed }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Compare release surfaces to DEPLOYED_STATE
        id: check
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEPLOYED_STATE_JSON: ${{ vars.DEPLOYED_STATE_production }}
        run: bash .github/scripts/check-production-deploy-needed.sh

      - name: Write deploy gate summary
        env:
          SHOULD_DEPLOY: ${{ steps.check.outputs.should_deploy }}
          SKIP_REASONS: ${{ steps.check.outputs.skip_reasons }}
        run: |
          {
            echo "### Production release gate"
            echo ""
            echo "**should_deploy:** \`${SHOULD_DEPLOY}\`"
            if [ -n "${SKIP_REASONS}" ]; then
              echo ""
              echo "### Skipped surfaces"
              echo ""
              while IFS= read -r reason; do
                [ -z "${reason}" ] && continue
                echo "- ${reason}"
              done <<< "${SKIP_REASONS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy production
    needs: [check-not-deployed]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      ref: ${{ github.event.release.tag_name }}
      should_deploy: ${{ needs.check-not-deployed.outputs.should_deploy }}
      force_full_deploy: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_deploy && 'true' || 'false' }}
    secrets: inherit

  detect-ghcr-targets:
    name: Production · Detect GHCR targets
    needs: [check-not-deployed]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      push_ghcr_api: ${{ steps.detect.outputs.push_ghcr_api }}
      push_ghcr_web: ${{ steps.detect.outputs.push_ghcr_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve force full deploy
        id: force
        env:
          REQUESTED_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_deploy && 'true' || 'false' }}
          DEPLOYED_STATE_JSON: ${{ vars.DEPLOYED_STATE_production }}
        run: |
          FORCE="$REQUESTED_FORCE"
          if [ "$FORCE" != "true" ]; then
            if [ -z "$DEPLOYED_STATE_JSON" ] || ! node -e 'try{const p=JSON.parse(process.argv[1]);process.exit(p&&typeof p==="object"&&!Array.isArray(p)?0:1)}catch{process.exit(1)}' "$DEPLOYED_STATE_JSON"; then
              echo "detect-deploy-targets: missing or invalid DEPLOYED_STATE — forcing full deploy"
              FORCE="true"
            fi
          fi
          echo "force_full_deploy=$FORCE" >> "$GITHUB_OUTPUT"

      - name: Detect deploy targets
        id: detect
        env:
          ENVIRONMENT: production
          HEAD_REF: ${{ github.event.release.tag_name }}
          BASE_REF: ""
          FORCE_FULL_DEPLOY: ${{ steps.force.outputs.force_full_deploy }}
          DEPLOYED_STATE_JSON: ${{ vars.DEPLOYED_STATE_production }}
        run: bash .github/scripts/detect-deploy-targets.sh

  push-ghcr-api:
    name: Production · GHCR · Push slugbase-api
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, detect-ghcr-targets]
    if: >-
      needs.check-not-deployed.outputs.should_deploy == 'true' &&
      needs.check-not-deployed.outputs.deploy_api_needed == 'true' &&
      needs.detect-ghcr-targets.outputs.push_ghcr_api == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read API package version
        id: version
        run: echo "semver=$(node -p "require('./packages/backend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          bash .github/scripts/build-push-ghcr.sh
          --target api
          ghcr.io/${{ format('{0}-api', github.repository) }}
          ${{ steps.version.outputs.semver }}
          --latest

  push-ghcr-web:
    name: Production · GHCR · Push slugbase-web
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, detect-ghcr-targets]
    if: >-
      needs.check-not-deployed.outputs.should_deploy == 'true' &&
      needs.check-not-deployed.outputs.deploy_web_needed == 'true' &&
      needs.detect-ghcr-targets.outputs.push_ghcr_web == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read web package version
        id: version
        run: echo "semver=$(node -p "require('./packages/web/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          bash .github/scripts/build-push-ghcr.sh
          --target web
          ghcr.io/${{ format('{0}-web', github.repository) }}
          ${{ steps.version.outputs.semver }}
          --latest

  record-deployed-version:
    name: Production · Record release tag
    needs:
      [
        check-not-deployed,
        deploy,
        push-ghcr-api,
        push-ghcr-web,
      ]
    if: >-
      needs.check-not-deployed.outputs.should_deploy == 'true'
      && needs.deploy.result == 'success'
      && needs.push-ghcr-api.result != 'failure'
      && needs.push-ghcr-web.result != 'failure'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: write
    steps:
      - name: Record aggregate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh variable set DEPLOYED_VERSION --body "${{ github.event.release.tag_name }}"
