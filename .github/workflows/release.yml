name: Release

# Builds and pushes the Community Edition image when a push to main bumps the
# version of apps/slugbase, and opens a draft GitHub Release for it (doc 08
# section 6.2, Q12, Q17, Q92). The image carries an SPDX SBOM and provenance
# attestations and is signed with cosign, keyless, by the identity of this
# workflow on main (doc 10 T16, Q92).
# scripts/release-plan.sh decides whether to release and which tag to push: a
# build pushes :<version> only, for a pre-release and for any other version. The
# floating tags :<major>.<minor> and :latest are never pushed by a build, because
# a build is a draft release candidate: they move in the publish job, when a
# maintainer publishes the release (below). An image tag that already exists is
# never overwritten: `plan` refuses an existing version, and the build
# job asks the registry again immediately before the push
# (scripts/release-check-tags.sh), because "Re-run failed jobs" skips `plan`. A
# failed release is not re-run. It is abandoned for a new version bump, and a re-run
# of the build job after the push is refused by that check.
# After the image is pushed, the workflow creates the lightweight git tag
# v<version> on the pushed commit through the API (scripts/release-tag.sh), then
# signs the image by the digest it pushed and attests its SBOM and provenance, and
# only then opens the draft release from that existing tag. GitHub creates the
# tag of a draft only when the draft is published, so without this step a built
# release candidate would have no tag. A tag that already exists on the same
# commit lets the step go on; one on another commit fails the job before the
# draft is made.
#
# When the draft is published, the publish job runs scripts/release-publish.sh,
# which moves :latest and :<major>.<minor> to the digest the build signed, for a
# version without a suffix only. A pre-release moves nothing. The release is read
# from the API; the digest is the one named in the release notes; the move is
# made only after scripts/verify-image.sh confirms that :<version> is that digest
# and that it is signed, with its attestations, by the identity of this workflow
# on main, and each tag moved is verified again by digest afterwards. Any other
# answer stops the job before the move.
#
# The workflow runs on a push to main and on a published release and on nothing
# else, so no pull request, fork or comment can start it. Publishing a release
# needs write access to the repository, as pushing to main does, and a draft made
# with the workflow token does not start it. The workflow reads no secret: the
# workflow token (github.token) is the only credential, and the scopes it needs are
# contents (the tag and the draft release, read-only in publish), packages (the
# image, its signature, and the tags the publish job moves) and id-token (only the
# build job: the OIDC token that keyless signing exchanges for a short-lived
# certificate; there is no key material anywhere) (doc 10 T16).
# Only the upstream repository builds, pushes and publishes; the plan job decides in
# any repository, so it can be run on its own. Each action is pinned to a full
# commit SHA.

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

# One run at a time for a push to main, and one per release tag. The group differs
# per tag, so publishes of different tags are not queued by it; the publish job has
# a group of its own below.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/mdg-labs/slugbase

jobs:
  plan:
    name: plan
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading only: this job decides and pushes nothing.
    permissions:
      contents: read
      packages: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      git_tag: ${{ steps.plan.outputs.git_tag }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      # The whole history and every tag: the previous commit of the push and the
      # tag check must be there.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the release
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RELEASE_IMAGE: ${{ env.IMAGE }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/release-plan.sh "$BEFORE" "$SHA"

  build:
    name: build and push
    needs: plan
    if: ${{ github.event_name == 'push' && needs.plan.outputs.release == 'true' && github.repository == 'mdg-labs/slugbase' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      # The image build fetches each package from where the lockfile says.
      - name: Check the lockfile sources
        run: bash scripts/check-lockfile-sources.sh
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login "${IMAGE%%/*}" --username "$REGISTRY_USER" --password-stdin
      # SBOM and provenance attestations need BuildKit's container driver. The
      # builder and the SBOM generator are named by digest: the builder writes the
      # layers, the SBOM and the provenance, and receives the registry credential.
      # Renovate keeps the tags and digests current.
      - name: Create the builder
        run: |
          docker buildx create --name release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe \
            --use
      # The image is scanned before anything is pushed. The same builder builds it
      # again below from its cache, so the SBOM scanned is the one of the image
      # pushed. A High or Critical finding with a fix, or a scanner that fails,
      # stops the job here.
      - name: Install the scanner
        run: |
          set -euo pipefail
          bash scripts/scan-image.sh --install "$RUNNER_TEMP/osv-scanner"
          echo "OSV_SCANNER=$RUNNER_TEMP/osv-scanner/osv-scanner" >> "$GITHUB_ENV"
      - name: Check the scanner reports a known vulnerability
        run: |
          set -euo pipefail
          bash scripts/scan-image.sh --canary scripts/fixtures/image-scan/canary.spdx.json
          bash scripts/scan-image.sh --canary scripts/fixtures/image-scan/canary-debian.spdx.json
      - name: Scan the image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file apps/slugbase/Dockerfile \
            --build-arg "VERSION=$VERSION" \
            --build-arg "BUILD_COMMIT=$BUILD_COMMIT" \
            --sbom=generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 \
            --output "type=local,dest=$RUNNER_TEMP/image" \
            .
          bash scripts/scan-image.sh "$RUNNER_TEMP/image/sbom.spdx.json"
      # The image has to say which commit it was built from: its revision label
      # and the commit /version reports both default to "unknown" when the build
      # argument is lost. The build is the same one as above, from the cache.
      - name: Check the image names its commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          check_image="slugbase-release-check:local"
          docker buildx build \
            --file apps/slugbase/Dockerfile \
            --build-arg "VERSION=$VERSION" \
            --build-arg "BUILD_COMMIT=$BUILD_COMMIT" \
            --load \
            --tag "$check_image" \
            .
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$check_image")"
          reported="$(docker run --rm --entrypoint cat "$check_image" /app/apps/slugbase/dist/build-info.json | jq -r '.commit')"
          if [[ "$revision" != "$BUILD_COMMIT" || "$reported" != "$BUILD_COMMIT" ]]; then
            echo "The image names another commit than the one built: label '$revision', /version '$reported', expected '$BUILD_COMMIT'." >&2
            exit 1
          fi
      # The tags come from the plan; the version it validated is semver, so it
      # holds nothing a shell would read as syntax.
      - name: Build and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAGS: ${{ needs.plan.outputs.tags }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A re-run of this job skips `plan`, so the refusal of an existing version
          # is made here, immediately before the push: no tag that exists is pushed.
          bash scripts/release-check-tags.sh
          tag_args=()
          IFS=',' read -r -a tag_list <<<"$TAGS"
          for tag in "${tag_list[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx build \
            --file apps/slugbase/Dockerfile \
            --build-arg "VERSION=$VERSION" \
            --build-arg "BUILD_COMMIT=$BUILD_COMMIT" \
            --sbom=generator=docker/buildkit-syft-scanner:1.12.1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 \
            --provenance=mode=max \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            "${tag_args[@]}" \
            .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The build reported no image digest." >&2
            exit 1
          fi
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      # The tag v<version> is made on the pushed commit before the draft, which is
      # then made from it. A tag on another commit fails here and no draft is made.
      # If this step or one of the next fails after the push, the image is in the
      # registry and the job is not re-run. A re-run is refused before the push by
      # scripts/release-check-tags.sh, because the version tag exists by then, so it
      # cannot push that tag again with a new digest. A missing tag or draft is made by hand
      # from the digest in the build step's log. A missing signature cannot be: a
      # signature made by hand does not carry the identity of this workflow on main,
      # which scripts/verify-image.sh requires. That version stays unsigned and is
      # abandoned for the next version bump.
      - name: Create the version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ needs.plan.outputs.git_tag }}
          SHA: ${{ github.sha }}
        run: bash scripts/release-tag.sh
      # The image is signed by the digest the build pushed, so the digest signed is
      # the digest pushed whatever a tag points at later. The signature is keyless:
      # cosign exchanges this job's OIDC token for a certificate that names this
      # workflow on main, and records the signature in the public transparency log.
      # The SBOM and the provenance that BuildKit attached to the image are read
      # back from the registry by that digest and signed as attestations, which is
      # what cosign verify-attestation reads.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Sign the image and attest its SBOM and provenance
        timeout-minutes: 15
        run: |
          set -euo pipefail
          subject="$IMAGE@$DIGEST"
          sbom="$RUNNER_TEMP/sbom.spdx.json"
          provenance="$RUNNER_TEMP/provenance.json"
          docker buildx imagetools inspect "$subject" --format '{{ json .SBOM.SPDX }}' | jq -c . > "$sbom"
          docker buildx imagetools inspect "$subject" --format '{{ json .Provenance.SLSA }}' | jq -c . > "$provenance"
          jq -e '.spdxVersion | startswith("SPDX-")' "$sbom" > /dev/null
          jq -e '.buildDefinition and .runDetails' "$provenance" > /dev/null
          cosign sign --yes "$subject"
          cosign attest --yes --type spdxjson --predicate "$sbom" "$subject"
          cosign attest --yes --type slsaprovenance1 --predicate "$provenance" "$subject"
      # Every check an operator makes with scripts/verify-image.sh is made here
      # before the draft: by the digest, and by each tag that was pushed, which has
      # to point at that digest.
      - name: Verify the signature and the attestations
        timeout-minutes: 15
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          bash scripts/verify-image.sh --digest "$DIGEST" "$IMAGE@$DIGEST"
          IFS=',' read -r -a tag_list <<<"$TAGS"
          for tag in "${tag_list[@]}"; do
            bash scripts/verify-image.sh --digest "$DIGEST" "$tag"
          done
      # The release is a draft made from the existing tag, a pre-release when the
      # version has a suffix. --verify-tag aborts if the tag is missing instead of
      # letting GitHub create one from the default branch. The notes are
      # docs/releases/<version>.md of the built commit, when it exists, followed by
      # the lines that name the image (scripts/release-notes.sh), whose digest line
      # the publish job reads.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          GIT_TAG: ${{ needs.plan.outputs.git_tag }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          TAGS: ${{ needs.plan.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          bash scripts/release-notes.sh "$notes"
          flags=(--draft --verify-tag --title "$VERSION" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GIT_TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  # Runs when a maintainer publishes the draft the build made. The floating tags
  # move here and nowhere else, to the digest the build signed. The job reads the
  # release, verifies the signature and only then retags, and it holds no
  # id-token: it signs nothing. `release.tag_name` is passed through the
  # environment and read as v<semver> by the script, never put into the shell text.
  publish:
    name: publish
    if: ${{ github.event_name == 'release' && github.repository == 'mdg-labs/slugbase' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One publish running at a time across tags, so that two publishes made close
    # together do not retag at the same time; a running job is never cancelled. A
    # group holds one running and one pending job, and a newer pending job replaces
    # the one already waiting, which GitHub reports as cancelled. That is why the
    # script does not move only its own release: every run puts :latest on the
    # highest published release and :<major>.<minor> on the highest of its line,
    # verified. The run that replaced a dropped one therefore repairs :latest and
    # its own line's tag; the tag of another line waits for that line's next
    # publish or for a re-run of the cancelled run. A run that finds the tags
    # right is a green no-op.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Log in to the registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login "${IMAGE%%/*}" --username "$REGISTRY_USER" --password-stdin
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Verify the signed digest and move the floating tags
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IMAGE: ${{ env.IMAGE }}
        run: bash scripts/release-publish.sh
