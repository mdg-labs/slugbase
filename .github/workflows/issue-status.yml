name: Issue status

# The machine-owned part of the status:* lifecycle. Agents own the middle of it
# (in-progress → in-review → implemented, see .claude/skills/orchestrate);
# this owns the two ends, where there is no agent in the loop — an issue being
# filed, and an issue being closed — and status:blocked, which follows the
# native blocked-by links.
#
# It also closes a milestone once no open issue or pull request is left in it
# (on close, and when the last open one is removed from it), reopens it when an
# issue in it is reopened, and assigns the maintainer to any issue that has no
# assignee. An issue that already has an assignee is never touched.
#
# Blocked. An issue is blocked while any of its blocked-by issues is open and
# not at status:implemented (that one has landed on the integration branch,
# which executors branch from). Only an issue at status:new or status:ready is
# moved to status:blocked; at any other status an executor may own it, so it is
# left alone. When the last blocker is gone the issue goes back to status:ready,
# or to status:new when it was never triaged (no "## Original report"). The
# dependents are recomputed when:
#   - the issue itself is opened or reopened;
#   - a blocker is closed;
#   - a blocker enters or leaves status:implemented (labeled / unlabeled below).
# A new blocked-by edge is not a trigger here: GitHub sends an issue_dependencies
# webhook event, but its docs do not list it among the events an Actions
# workflow can use, so it is not relied on. .claude/scripts/gh-helpers.sh
# add-blocked-by recomputes the dependent itself right after adding the edge.
#
# labeled / unlabeled are triggers only for status:implemented, where the job
# `if` below skips every other label, because that is the one status change
# that decides whether another issue is blocked. Every other status change
# would wake this twice (a PATCH that swaps labels emits both events) for
# nothing, and the one-status invariant doesn't need it:
# .claude/scripts/issue-status.sh replaces the label set in a single call, so
# an agent cannot leave two behind in the first place. This job still
# normalises what it finds whenever it does run, which covers a hand edit at
# the next open/close. Writes made with the workflow's GITHUB_TOKEN start no
# new runs, so its own label swaps cannot loop. The concurrency group is on the
# job, so a run the `if` skips does not queue behind a running one.

on:
  issues:
    types: [opened, closed, reopened, demilestoned, labeled, unlabeled]

permissions:
  issues: write

jobs:
  set-status:
    if: ${{ (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'status:implemented' }}
    concurrency:
      group: issue-status-${{ github.event.issue.number }}
      cancel-in-progress: false
    # A short job: on the self-hosted runners it runs on runners01-light.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { action } = context.payload;
            // An organisation cannot be an assignee, so the maintainer is named
            // explicitly. Rendered by setup from workflow.json "maintainer".
            const MAINTAINER = 'mdguggenbichler';
            // The status:* labels as [{ name, color, description }], rendered
            // by setup from scripts/status-labels.txt, the one place they are
            // defined.
            const STATUS_LABELS = [{"name":"status:new","color":"ededed","description":"Filed, not yet triaged"},{"name":"status:ready","color":"bfd4f2","description":"Triaged and ready to be picked up"},{"name":"status:blocked","color":"d93f0b","description":"Waiting on an open blocker (a native blocked-by link)"},{"name":"status:in-progress","color":"fbca04","description":"An executor is implementing this"},{"name":"status:in-review","color":"d4c5f9","description":"Implementation committed, awaiting verification"},{"name":"status:implemented","color":"c2e0c6","description":"Verification passed, landed on the integration branch"},{"name":"status:closed","color":"586069","description":"Closed as completed"},{"name":"status:cancelled","color":"8b4513","description":"Closed as not planned, or as a duplicate"}];
            const issue_number = context.payload.issue.number;

            const TERMINAL = ['status:closed', 'status:cancelled'];
            // The statuses a blocker can move an issue between. Any other one
            // may be owned by an executor and is never touched for blocking.
            const BLOCKABLE = ['status:new', 'status:ready'];
            const namesOf = issue => issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            const statusesOf = issue => namesOf(issue).filter(n => n.startsWith('status:'));
            const read = async n =>
              (await github.rest.issues.get({ ...context.repo, issue_number: n })).data;
            // GitHub answers 404 for a label the issue no longer carries; a
            // racing writer removing it first is the same outcome.
            const remove = async (n, name) => {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: n, name });
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            };
            // GitHub creates a label that is missing on addLabels, but grey and
            // without a description. Create it from its definition first.
            const ensured = new Set();
            const ensureLabel = async name => {
              if (ensured.has(name)) return;
              try {
                await github.rest.issues.getLabel({ ...context.repo, name });
              } catch (err) {
                if (err.status !== 404) throw err;
                const def = STATUS_LABELS.find(l => l.name === name);
                if (def) {
                  try {
                    await github.rest.issues.createLabel({
                      ...context.repo, name, color: def.color, description: def.description,
                    });
                  } catch (err2) {
                    // A racing run created it first.
                    if (err2.status !== 422) throw err2;
                  }
                }
              }
              ensured.add(name);
            };
            // The issues on the other end of a native dependency link:
            // 'blocked_by' (what blocks n) or 'blocking' (what n blocks).
            const dependencies = async (n, kind) => {
              const found = [];
              for (let page = 1; ; page++) {
                const { data } = await github.request(
                  'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/{kind}',
                  { ...context.repo, issue_number: n, kind, per_page: 100, page },
                );
                found.push(...data);
                if (data.length < 100) return found;
              }
            };

            // The status this run wants, from a fresh read of the issue, or null
            // to leave it alone.
            const decide = (issue, statuses) => {
              if (action === 'closed') {
                // GitHub sends 'completed', 'not_planned' or 'duplicate'; anything
                // else (including null) is an ordinary close, i.e. completed.
                return ['not_planned', 'duplicate'].includes(issue.state_reason)
                  ? 'status:cancelled'
                  : 'status:closed';
              }
              if (action === 'reopened') {
                // A reopen leaves status:closed or status:cancelled behind. Any
                // other status was set since, by an agent that already claimed
                // the issue, so it is kept rather than reset to status:new.
                const kept = statuses.filter(n => !TERMINAL.includes(n));
                return kept.length ? kept.slice().sort()[0] : 'status:new';
              }
              // Opened without one.
              if (statuses.length === 0) return 'status:new';
              // Opened carrying several, only reachable by hand. Keep one,
              // deterministically, rather than leaving the issue ambiguous.
              if (statuses.length > 1) return statuses.slice().sort()[0];
              // Opened with exactly one: the filer meant it, leave it alone.
              return null;
            };

            // Writes the status this run wants onto issue n, whose statuses were
            // read just before. Used for the triggering issue and for every
            // other issue a blocker change touches, so the race handling below
            // applies to all of them. `yields` says a status someone else set
            // meanwhile wins over ours: true for status:new and for the
            // blocked/unblocked moves, which are defaults, not decisions.
            const writeStatus = async (n, want, statuses, yields = want === 'status:new') => {
              // Only the status labels that change are written: addLabels for
              // ours, removeLabel for each one it replaces. Never setLabels,
              // which replaces the whole set, so writing back a set read
              // earlier would drop any label added since, status or not. Added
              // first, so a run that fails midway leaves two statuses (the next
              // run normalises them), never none. Added even when the read
              // already showed it: that read can be stale, and addLabels is
              // idempotent.
              await ensureLabel(want);
              await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: [want] });
              for (const s of statuses.filter(s => s !== want)) await remove(n, s);

              // A writer can still land between the read and these writes.
              // Re-read after them (the point is to see the racing writer's
              // label if it landed) and settle on one status: when ours yields
              // (status:new, this job's default for an issue nobody
              // classified, or a blocked/unblocked move) a status anyone else
              // set wins over it. closed, cancelled and a hand-made cleanup
              // are this job's to decide, so ours wins over theirs. A writer
              // that swaps the whole set in one call (as issue-status.sh does)
              // can leave theirs alone, without ours.
              const after = statusesOf(await read(n));
              if (after.length === 0) {
                // A racing writer removed ours after we added it, and we then
                // removed theirs: put ours back rather than leave none.
                await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: [want] });
                core.info(`#${n}: raced to no status → ${want}`);
              } else if (after.length > 1) {
                const others = after.filter(s => s !== want).sort();
                const winner = yields ? others[0] : want;
                for (const s of after.filter(s => s !== winner)) await remove(n, s);
                core.info(`#${n}: raced (${after.join(', ')}) → kept ${winner}`);
              } else if (after[0] !== want) {
                if (yields) {
                  core.info(`#${n}: raced → kept ${after[0]}`);
                } else {
                  await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: [want] });
                  await remove(n, after[0]);
                  core.info(`#${n}: raced (${after[0]}) → ${want}`);
                }
              } else {
                core.info(`#${n}: ${statuses.join(', ') || 'none'} → ${want}`);
              }
            };

            // Brings issue n's blocked state in line with its blocked-by links,
            // from a fresh read of both. A blocker that is open and not at
            // status:implemented blocks. Moves only new/ready to blocked, and
            // only blocked back to ready (or new when untriaged: the body has
            // no "## Original report", the marker issue-readiness.sh uses).
            const reconcile = async n => {
              const it = await read(n);
              if (it.state !== 'open') return;
              const statuses = statusesOf(it);
              if (statuses.length !== 1) return;
              const [current] = statuses;
              if (![...BLOCKABLE, 'status:blocked'].includes(current)) return;
              const blockers = (await dependencies(n, 'blocked_by'))
                .filter(b => b.state === 'open' && !namesOf(b).includes('status:implemented'));
              let want = current;
              if (blockers.length) {
                want = 'status:blocked';
              } else if (current === 'status:blocked') {
                want = (it.body || '').includes('## Original report') ? 'status:ready' : 'status:new';
              }
              if (want === current) return;
              core.info(`#${n}: ${blockers.length} open blocker(s)`);
              await writeStatus(n, want, statuses, true);
            };
            // The 'blocking' list can include issues of other repositories,
            // whose numbers mean nothing here: skip them. (A blocker of another
            // repository in a 'blocked_by' list still counts, from the state
            // and labels the payload carries; it is never re-read here.) Each
            // dependent is isolated: one that throws is collected, the rest are
            // still done, and the job is failed at the end with the summary.
            const sameRepo = d => !d.repository_url ||
              d.repository_url.toLowerCase().endsWith(
                `/repos/${context.repo.owner}/${context.repo.repo}`.toLowerCase());
            const reconcileBlockedBy = async n => {
              const errors = [];
              for (const d of await dependencies(n, 'blocking')) {
                if (!sameRepo(d)) {
                  core.info(`#${d.number}: in another repository (${d.repository_url}), skipped`);
                  continue;
                }
                try {
                  await reconcile(d.number);
                } catch (err) {
                  errors.push(`#${d.number}: ${err.message}`);
                }
              }
              if (errors.length) core.setFailed(`could not update dependents: ${errors.join('; ')}`);
            };

            // A milestone closes when nothing in it is open (its count includes
            // open pull requests, which rightly keep it open) and reopens when
            // something in it is reopened. Read fresh: the issue's own copy of
            // the milestone is a snapshot.
            const settleMilestone = async (number, reopen) => {
              if (!number) return;
              const { data: m } = await github.rest.issues.getMilestone({
                ...context.repo, milestone_number: number,
              });
              const state = reopen ? 'open' : m.open_issues === 0 ? 'closed' : m.state;
              if (m.state === state) return;
              await github.rest.issues.updateMilestone({
                ...context.repo, milestone_number: number, state,
              });
              core.info(`milestone "${m.title}": ${m.state} → ${state}`);
            };

            if (action === 'labeled' || action === 'unlabeled') {
              // The job `if` lets only status:implemented through. Entering it
              // can unblock what this issue blocks; leaving it (an integration
              // PR dropped) blocks them again.
              await reconcileBlockedBy(issue_number);
              return;
            }
            if (action === 'demilestoned') {
              // The payload's milestone is the one the issue left.
              await settleMilestone((context.payload.milestone || {}).number, false);
              return;
            }

            // Re-read the issue instead of trusting context.payload.issue. The
            // payload is a snapshot taken when the event fired; this job starts
            // seconds later, and in that window an agent that just created
            // the issue has typically already called
            // .claude/scripts/issue-status.sh. Deciding on the snapshot put
            // status:new over the status the script had just set (seen in
            // practice: ready reverted to new). The read sits right before the
            // writes, and the assignment below waits until they are done, so the
            // window a racing writer can land in stays as small as it can be.
            const live = await read(issue_number);
            const statuses = statusesOf(live);
            const want = decide(live, statuses);

            if (want === null) {
              core.info(`#${issue_number}: nothing to do (${statuses.join(', ') || 'no status'})`);
            } else if (statuses.length === 1 && statuses[0] === want) {
              core.info(`#${issue_number} is already ${want}`);
            } else {
              await writeStatus(issue_number, want, statuses);
            }

            // Assign the maintainer to anything nobody owns yet. This rides on
            // the triggers the status lifecycle already needs (no event types
            // just for it), so it only fires on an issue this workflow was
            // touching anyway. Runs after the status write so it cannot widen
            // the window between that write and the read it is based on.
            //
            // Never touches an issue that already has an assignee, and skipped
            // on close: putting a fresh assignee (and its notification) on an
            // issue that just went away is noise, not ownership.
            //
            // Best-effort by design. addAssignees silently ignores a login
            // without push access, and any failure here must not fail the job
            // whose real purpose, the status write, already succeeded.
            if (action !== 'closed' && (live.assignees || []).length === 0) {
              try {
                await github.rest.issues.addAssignees({
                  ...context.repo,
                  issue_number,
                  assignees: [MAINTAINER],
                });
                core.info(`#${issue_number}: unassigned → @${MAINTAINER}`);
              } catch (err) {
                core.warning(`#${issue_number}: could not assign @${MAINTAINER}: ${err.message}`);
              }
            }

            // What the new state means for other issues and the milestone.
            if (action === 'closed') {
              // The milestone first: a failing dependent must not skip it.
              await settleMilestone((live.milestone || {}).number, false);
              await reconcileBlockedBy(issue_number);
            } else {
              await reconcile(issue_number);
              if (action === 'reopened') await settleMilestone((live.milestone || {}).number, true);
            }
