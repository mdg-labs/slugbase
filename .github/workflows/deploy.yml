name: Deploy

# Parameterized deploy pipeline — plan (live /version probes or caller_plan) → migrate → build/push images → Coolify webhook → smoke.
# Called from staging.yml (after CI + shared plan) and main.yml (production).
# workflow_call only — no direct triggers (spec §22).

on:
  workflow_call:
    secrets: inherit
    inputs:
      environment:
        description: GitHub Actions environment (staging | production)
        type: string
        required: true
      ref:
        description: Checkout ref (production release tag; omit for staging)
        type: string
        required: false
        default: ""
      should_deploy:
        description: >-
          When false, skip migrate through smoke
          (production re-publish of an already-deployed tag).
        type: string
        required: false
        default: "true"
      force_full_deploy:
        description: >-
          Deploy all surfaces regardless of live version compare (maps to manual plan mode).
        type: string
        required: false
        default: "false"
      deploy_mode:
        description: auto (live /version probes) | manual (skip live compare)
        type: string
        required: false
        default: "auto"
      caller_plan:
        description: When true, use plan inputs from caller (skip live /version probes)
        type: string
        required: false
        default: "false"
      deploy_api:
        description: Caller plan — deploy API
        type: string
        required: false
        default: "false"
      deploy_web:
        description: Caller plan — deploy web
        type: string
        required: false
        default: "false"
      deploy_marketing:
        description: Caller plan — deploy marketing
        type: string
        required: false
        default: "false"
      deploy_admin:
        description: Caller plan — deploy admin
        type: string
        required: false
        default: "false"
      run_migrate:
        description: Caller plan — run API migrations
        type: string
        required: false
        default: "false"
      run_migrate_admin:
        description: Caller plan — run admin migrations
        type: string
        required: false
        default: "false"
      push_ghcr_api:
        description: Caller plan — push API GHCR image (CE)
        type: string
        required: false
        default: "false"
      push_ghcr_web:
        description: Caller plan — push web GHCR image (CE)
        type: string
        required: false
        default: "false"
      skip_reasons:
        description: Caller plan — skip reasons (newline-separated)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}${{ inputs.ref != '' && format('-{0}', inputs.ref) || '' }}
  cancel-in-progress: ${{ inputs.environment != 'production' }}

jobs:
  plan:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 0 · Deploy plan
    if: >-
      inputs.caller_plan == 'true' ||
      inputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      deploy_api: ${{ steps.plan.outputs.deploy_api }}
      deploy_web: ${{ steps.plan.outputs.deploy_web }}
      deploy_marketing: ${{ steps.plan.outputs.deploy_marketing }}
      deploy_admin: ${{ steps.plan.outputs.deploy_admin }}
      run_migrate: ${{ steps.plan.outputs.run_migrate }}
      run_migrate_admin: ${{ steps.plan.outputs.run_migrate_admin }}
      push_ghcr_api: ${{ steps.plan.outputs.push_ghcr_api }}
      push_ghcr_web: ${{ steps.plan.outputs.push_ghcr_web }}
      deployed_api: ${{ steps.plan.outputs.deployed_api }}
      deployed_web: ${{ steps.plan.outputs.deployed_web }}
      skip_reasons: ${{ steps.plan.outputs.skip_reasons }}
    steps:
      - name: Checkout
        if: inputs.caller_plan != 'true'
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Resolve or apply deploy plan
        id: plan
        env:
          CALLER_PLAN: ${{ inputs.caller_plan }}
          DEPLOY_API: ${{ inputs.deploy_api }}
          DEPLOY_WEB: ${{ inputs.deploy_web }}
          DEPLOY_MARKETING: ${{ inputs.deploy_marketing }}
          DEPLOY_ADMIN: ${{ inputs.deploy_admin }}
          RUN_MIGRATE: ${{ inputs.run_migrate }}
          RUN_MIGRATE_ADMIN: ${{ inputs.run_migrate_admin }}
          PUSH_GHCR_API: ${{ inputs.push_ghcr_api }}
          PUSH_GHCR_WEB: ${{ inputs.push_ghcr_web }}
          SKIP_REASONS: ${{ inputs.skip_reasons }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          SHOULD_DEPLOY: ${{ inputs.should_deploy }}
          FORCE_FULL_DEPLOY: ${{ inputs.force_full_deploy }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          MARKETING_ORIGIN: ${{ vars.MARKETING_ORIGIN }}
          ADMIN_URL: ${{ secrets.ADMIN_URL }}
        run: |
          if [ "${CALLER_PLAN}" = "true" ]; then
            echo "deploy_api=${DEPLOY_API}" >> "$GITHUB_OUTPUT"
            echo "deploy_web=${DEPLOY_WEB}" >> "$GITHUB_OUTPUT"
            echo "deploy_marketing=${DEPLOY_MARKETING}" >> "$GITHUB_OUTPUT"
            echo "deploy_admin=${DEPLOY_ADMIN}" >> "$GITHUB_OUTPUT"
            echo "run_migrate=${RUN_MIGRATE}" >> "$GITHUB_OUTPUT"
            echo "run_migrate_admin=${RUN_MIGRATE_ADMIN}" >> "$GITHUB_OUTPUT"
            echo "push_ghcr_api=${PUSH_GHCR_API}" >> "$GITHUB_OUTPUT"
            echo "push_ghcr_web=${PUSH_GHCR_WEB}" >> "$GITHUB_OUTPUT"
            echo "deployed_api=false" >> "$GITHUB_OUTPUT"
            echo "deployed_web=false" >> "$GITHUB_OUTPUT"
            echo "skip_reasons<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${SKIP_REASONS}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/resolve-deploy-plan.mjs
          fi

      - name: Write deploy plan summary
        if: inputs.caller_plan != 'true'
        env:
          DEPLOY_API: ${{ steps.plan.outputs.deploy_api }}
          DEPLOY_WEB: ${{ steps.plan.outputs.deploy_web }}
          DEPLOY_MARKETING: ${{ steps.plan.outputs.deploy_marketing }}
          DEPLOY_ADMIN: ${{ steps.plan.outputs.deploy_admin }}
          SKIP_REASONS: ${{ steps.plan.outputs.skip_reasons }}
        run: |
          {
            echo "### Deploy plan (${{ inputs.environment }})"
            echo ""
            echo "| Surface | Deploy |"
            echo "|---|---|"
            echo "| API | ${DEPLOY_API} |"
            echo "| Web | ${DEPLOY_WEB} |"
            echo "| Marketing | ${DEPLOY_MARKETING} |"
            echo "| Admin | ${DEPLOY_ADMIN} |"
            if [ -n "${SKIP_REASONS}" ]; then
              echo ""
              echo "### Skipped surfaces"
              echo ""
              while IFS= read -r reason; do
                [ -z "${reason}" ] && continue
                echo "- ${reason}"
              done <<< "${SKIP_REASONS}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 1 · Run DB migrations
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.run_migrate == 'true' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/ci/run-migrate.sh

  migrate-admin:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 1 · Run admin DB migrations
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.run_migrate_admin == 'true' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Run admin Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: bash scripts/ci/run-migrate-admin.sh

  derive-sentry-release-api:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 2 · Derive API Sentry release
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.deploy_api == 'true' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan]
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Derive API Sentry release
        id: release
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/ci/derive-sentry-release.sh --package api

  derive-sentry-release-web:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 2 · Derive web Sentry release
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.deploy_web == 'true' &&
      needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan]
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Derive web Sentry release
        id: release
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/ci/derive-sentry-release.sh --package web

  deploy-api:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 3 · Deploy API (registry + Coolify)
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.deploy_api == 'true' &&
      needs.plan.result == 'success' &&
      needs.migrate.result != 'failure' &&
      needs.derive-sentry-release-api.result != 'failure' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.derive-sentry-release-api.result == 'success' || needs.derive-sentry-release-api.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan, migrate, derive-sentry-release-api]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Build API and shared packages
        env:
          NODE_ENV: production
          SLUGBASE_EDITION: cloud
        run: pnpm exec turbo run build --filter=@slugbase/backend...

      - name: Create Sentry release and upload API source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: >-
          bash scripts/ci/sentry-release.sh api packages/backend/dist
          "${{ needs.derive-sentry-release-api.outputs.release }}" ${{ inputs.environment }}

      - name: Resolve image tag
        id: tag
        run: echo "version=$(node -p "require('./packages/backend/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to private registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push API image
        env:
          DOCKER_BUILDKIT: "1"
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          args=(--target api "${REGISTRY}/slugbase-api" "${{ steps.tag.outputs.version }}")
          if [ "${{ inputs.environment }}" = "staging" ]; then
            args+=(--dev)
          fi
          args+=(--no-latest)
          bash scripts/ci/build-push-registry.sh "${args[@]}"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK_API: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_API }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: bash scripts/ci/trigger-coolify-deploy.sh "$COOLIFY_DEPLOY_WEBHOOK_API" "$COOLIFY_DEPLOY_TOKEN"

  deploy-web:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 3 · Deploy web (registry + Coolify)
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.deploy_web == 'true' &&
      needs.plan.result == 'success' &&
      needs.migrate.result != 'failure' &&
      needs.derive-sentry-release-web.result != 'failure' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.derive-sentry-release-web.result == 'success' || needs.derive-sentry-release-web.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan, migrate, derive-sentry-release-web]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"

      - name: Build web packages for Sentry
        env:
          NODE_ENV: production
          SLUGBASE_EDITION: cloud
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          VITE_SENTRY_RELEASE: ${{ needs.derive-sentry-release-web.outputs.release }}
        run: pnpm exec turbo run build --filter=@slugbase/web...

      - name: Create Sentry release and upload web source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        run: >-
          bash scripts/ci/sentry-release.sh web packages/web/build
          "${{ needs.derive-sentry-release-web.outputs.release }}" ${{ inputs.environment }}

      - name: Resolve image tag
        id: tag
        run: echo "version=$(node -p "require('./packages/web/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to private registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push web image
        env:
          DOCKER_BUILDKIT: "1"
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          args=(--target web "${REGISTRY}/slugbase-web" "${{ steps.tag.outputs.version }}")
          if [ "${{ inputs.environment }}" = "staging" ]; then
            args+=(--dev)
          fi
          args+=(--no-latest)
          bash scripts/ci/build-push-registry.sh "${args[@]}"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK_WEB: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_WEB }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: bash scripts/ci/trigger-coolify-deploy.sh "$COOLIFY_DEPLOY_WEBHOOK_WEB" "$COOLIFY_DEPLOY_TOKEN"

  deploy-marketing:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 3 · Deploy marketing (registry + Coolify)
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.deploy_marketing == 'true' &&
      needs.plan.result == 'success' &&
      needs.migrate.result != 'failure' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan, migrate]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Resolve image tag
        id: tag
        run: echo "version=$(node -p "require('./packages/marketing/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to private registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push marketing image
        env:
          DOCKER_BUILDKIT: "1"
          REGISTRY: ${{ secrets.REGISTRY }}
          PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          PUBLIC_FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          PUBLIC_MARKETING_ORIGIN: ${{ vars.MARKETING_ORIGIN }}
          MARKETING_ORIGIN: ${{ vars.MARKETING_ORIGIN }}
        run: |
          args=(--target marketing "${REGISTRY}/slugbase-marketing" "${{ steps.tag.outputs.version }}")
          if [ "${{ inputs.environment }}" = "staging" ]; then
            args+=(--dev)
          fi
          args+=(--no-latest)
          bash scripts/ci/build-push-registry.sh "${args[@]}"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK_MARKETING: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_MARKETING }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: bash scripts/ci/trigger-coolify-deploy.sh "$COOLIFY_DEPLOY_WEBHOOK_MARKETING" "$COOLIFY_DEPLOY_TOKEN"

  deploy-admin:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 3 · Deploy admin (registry + Coolify)
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.outputs.deploy_admin == 'true' &&
      needs.plan.result == 'success' &&
      needs.migrate-admin.result != 'failure' &&
      (needs.migrate-admin.result == 'success' || needs.migrate-admin.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [plan, migrate-admin]
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Resolve image tag
        id: tag
        run: echo "version=$(node -p "require('./packages/admin/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to private registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push admin image
        env:
          DOCKER_BUILDKIT: "1"
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          args=(--target admin "${REGISTRY}/slugbase-admin" "${{ steps.tag.outputs.version }}")
          if [ "${{ inputs.environment }}" = "staging" ]; then
            args+=(--dev)
          fi
          args+=(--no-latest)
          bash scripts/ci/build-push-registry.sh "${args[@]}"

      - name: Trigger Coolify deploy
        env:
          COOLIFY_DEPLOY_WEBHOOK_ADMIN: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_ADMIN }}
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: bash scripts/ci/trigger-coolify-deploy.sh "$COOLIFY_DEPLOY_WEBHOOK_ADMIN" "$COOLIFY_DEPLOY_TOKEN"

  smoke:
    name: ${{ inputs.environment == 'production' && 'Production' || 'Staging' }} · 4 · Smoke
    if: >-
      always() &&
      inputs.should_deploy == 'true' &&
      needs.plan.result == 'success' &&
      (
        needs.plan.outputs.deploy_api == 'true' ||
        needs.plan.outputs.deploy_web == 'true' ||
        needs.plan.outputs.deploy_marketing == 'true' ||
        needs.plan.outputs.deploy_admin == 'true'
      ) &&
      needs.deploy-api.result != 'failure' &&
      needs.deploy-web.result != 'failure' &&
      needs.deploy-marketing.result != 'failure' &&
      needs.deploy-admin.result != 'failure'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs:
      [
        plan,
        deploy-api,
        deploy-web,
        deploy-marketing,
        deploy-admin,
      ]
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      MARKETING_ORIGIN: ${{ vars.MARKETING_ORIGIN }}
      ADMIN_URL: ${{ secrets.ADMIN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Build smoke flags
        id: smoke_flags
        run: |
          FLAGS=()
          if [ "${{ needs.plan.outputs.deploy_api }}" = "true" ]; then
            FLAGS+=(--api)
          fi
          if [ "${{ needs.plan.outputs.deploy_web }}" = "true" ]; then
            FLAGS+=(--web)
          fi
          if [ "${{ needs.plan.outputs.deploy_marketing }}" = "true" ]; then
            FLAGS+=(--marketing)
          fi
          if [ "${{ needs.plan.outputs.deploy_admin }}" = "true" ]; then
            FLAGS+=(--admin)
          fi
          echo "flags=${FLAGS[*]}" >> "$GITHUB_OUTPUT"

      - name: Smoke deployed surfaces
        if: steps.smoke_flags.outputs.flags != ''
        run: bash scripts/ci/smoke-staging-health.sh ${{ steps.smoke_flags.outputs.flags }}
