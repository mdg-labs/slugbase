name: CI/CD

# SlugBase consolidated pipeline (spec §22). CI checks (P1-09) + staging deploy (P6-10 / SB-79)
# + staging GHCR self-host `dev` tag + production deploy + release GHCR image (P6-11 / SB-80).

on:
  pull_request:
    branches: [staging, main]

  push:
    branches: [staging, main]

  release:
    types: [published]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/staging' }}

jobs:
  ci:
    name: CI · Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slugbase
          POSTGRES_PASSWORD: slugbase
          POSTGRES_DB: slugbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slugbase -d slugbase_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v4.0.0
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm --filter @slugbase/shared-types build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: dev

      - name: Tolgee translation completeness (pull --check)
        run: pnpm run i18n:check:tolgee

      - name: Hard-coded UI strings (rg)
        run: pnpm run i18n:check:hardcoded

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://slugbase:slugbase@localhost:5432/slugbase_test
          SLUGBASE_INTEGRATION_NO_DOCKER: "1"
        run: pnpm test:integration

      - name: Dependency audit
        run: pnpm audit --audit-level=high

  # ── Staging deploy (push to staging only, after CI checks pass) ─────────────

  deployment-staging-start:
    name: Staging · 1 · Deployment record start
    runs-on: ubuntu-latest
    environment: staging
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      id-token: write
      deployments: write
    outputs:
      deployment_id: ${{ steps.create.outputs.deployment_id }}
    steps:
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # v1
        id: create
        with:
          token: ${{ github.token }}
          environment: staging
          ref: ${{ github.sha }}
          description: SlugBase staging deploy

  build-server-staging:
    name: Staging · 2 · Build API
    runs-on: ubuntu-latest
    environment: staging
    needs: [ci, deployment-staging-start]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: staging
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Build API and shared packages
        env:
          NODE_ENV: production
        run: pnpm exec turbo run build --filter=@slugbase/backend...

  build-web-staging:
    name: Staging · 2 · Build web/marketing
    runs-on: ubuntu-latest
    environment: staging
    needs: [ci, deployment-staging-start]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: staging
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Build shared dependencies for web
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/web^... build

      - name: Build web client
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/web build

      - name: Build shared dependencies for marketing
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/marketing^... build

      - name: Build marketing site
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/marketing build

      - name: Pack Worker deploy artifacts
        run: bash .github/scripts/pack-staging-worker-artifacts.sh staging-worker-artifacts.tar.gz

      - name: Upload Worker deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-worker-artifacts
          path: staging-worker-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 1

  migrate-staging:
    name: Staging · 3 · Database migrate
    runs-on: ubuntu-latest
    environment: staging
    needs: build-server-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: staging
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Run database migrations
        run: bash .github/scripts/run-migrate-deploy.sh

  push-ghcr-staging-dev:
    name: Staging · 3 · Push self-host image (GHCR dev)
    runs-on: ubuntu-latest
    environment: staging
    needs: [ci, deployment-staging-start]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: staging

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push combined image (dev tag)
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          bash .github/scripts/build-push-ghcr.sh
          ghcr.io/${{ github.repository }}
          dev
          --no-latest

  deploy-fly-staging:
    name: Staging · 4 · Deploy API (Fly)
    runs-on: ubuntu-latest
    environment: staging
    needs: migrate-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: staging

      - name: Setup flyctl
        run: bash .github/scripts/setup-flyctl.sh

      - name: Deploy to Fly.io
        env:
          DOCKER_BUILDKIT: "1"
        run: bash .github/scripts/fly-deploy.sh slugbase-staging-api

  deploy-web-staging:
    name: Staging · 4 · Deploy web (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment: staging
    needs: [build-web-staging, migrate-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: staging
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Download Worker deploy artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-worker-artifacts

      - name: Restore Worker deploy artifacts
        run: bash .github/scripts/unpack-staging-worker-artifacts.sh staging-worker-artifacts.tar.gz

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/wrangler-deploy-web-retry.sh packages/web

  deploy-marketing-staging:
    name: Staging · 4 · Deploy marketing (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment: staging
    needs: [build-web-staging, migrate-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: staging
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Download Worker deploy artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-worker-artifacts

      - name: Restore Worker deploy artifacts
        run: bash .github/scripts/unpack-staging-worker-artifacts.sh staging-worker-artifacts.tar.gz

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/wrangler-deploy-retry.sh packages/marketing --config wrangler.jsonc

  smoke-staging:
    name: Staging · 5 · Smoke
    runs-on: ubuntu-latest
    environment: staging
    needs: [deploy-fly-staging, deploy-web-staging, deploy-marketing-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: staging

      - name: Smoke health endpoints
        run: bash .github/scripts/smoke-staging-health.sh

  deployment-staging-finish:
    name: Staging · 6 · Deployment record finish
    runs-on: ubuntu-latest
    needs: [deployment-staging-start, smoke-staging]
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/staging'
      && needs.deployment-staging-start.result != 'skipped'
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Update deployment status
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # v1
        with:
          token: ${{ github.token }}
          deployment_id: ${{ needs.deployment-staging-start.outputs.deployment_id }}
          state: ${{ needs.smoke-staging.result == 'success' && 'success' || 'failure' }}

  # ── Production deploy + GHCR (release published only — spec §22.7–22.8) ─────

  check-not-deployed:
    name: Production · 1 · Check deploy needed
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'release'
    outputs:
      should_deploy: ${{ steps.compare.outputs.should_deploy }}
    steps:
      - name: Compare release tag to deployed version
        id: compare
        run: |
          TAG="${{ github.event.release.tag_name }}"
          DEPLOYED="${{ vars.DEPLOYED_VERSION }}"
          if [ -n "$DEPLOYED" ] && [ "$TAG" = "$DEPLOYED" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already deployed — skipping"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Deploying release ${TAG}"
          fi

  deployment-production-start:
    name: Production · 2 · Deployment record start
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed]
    if: >-
      github.event_name == 'release'
      && needs.check-not-deployed.outputs.should_deploy == 'true'
    permissions:
      contents: read
      id-token: write
      deployments: write
    outputs:
      deployment_id: ${{ steps.create.outputs.deployment_id }}
    steps:
      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # v1
        id: create
        with:
          token: ${{ github.token }}
          environment: production
          ref: ${{ github.event.release.tag_name }}
          description: SlugBase production deploy ${{ github.event.release.tag_name }}

  build-server-production:
    name: Production · 3 · Build API
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, deployment-production-start]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: prod
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Build API and shared packages
        env:
          NODE_ENV: production
        run: pnpm exec turbo run build --filter=@slugbase/backend...

  build-web-production:
    name: Production · 3 · Build web/marketing
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, deployment-production-start]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: prod
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Build shared dependencies for web
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/web^... build

      - name: Build web client
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/web build

      - name: Build shared dependencies for marketing
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/marketing^... build

      - name: Build marketing site
        env:
          NODE_ENV: production
        run: pnpm --filter @slugbase/marketing build

      - name: Pack Worker deploy artifacts
        run: bash .github/scripts/pack-production-worker-artifacts.sh production-worker-artifacts.tar.gz

      - name: Upload Worker deploy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-worker-artifacts
          path: production-worker-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 1

  push-ghcr-image:
    name: Production · 3 · Push self-host image (GHCR)
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: prod

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push combined image
        env:
          DOCKER_BUILDKIT: "1"
        run: >
          bash .github/scripts/build-push-ghcr.sh
          ghcr.io/${{ github.repository }}
          ${{ github.event.release.tag_name }}

  migrate-production:
    name: Production · 4 · Database migrate
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, build-server-production]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: prod
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Run database migrations
        run: bash .github/scripts/run-migrate-deploy.sh

  deploy-fly-production:
    name: Production · 5 · Deploy API (Fly)
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, migrate-production]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: prod

      - name: Setup flyctl
        run: bash .github/scripts/setup-flyctl.sh

      - name: Deploy to Fly.io
        env:
          DOCKER_BUILDKIT: "1"
        run: bash .github/scripts/fly-deploy.sh slugbase-production-api

  deploy-web-production:
    name: Production · 5 · Deploy web (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, build-web-production, migrate-production]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: prod
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Download Worker deploy artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-worker-artifacts

      - name: Restore Worker deploy artifacts
        run: tar -xzf production-worker-artifacts.tar.gz

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/wrangler-deploy-web-retry.sh packages/web build/server/wrangler.deploy.json

  deploy-marketing-production:
    name: Production · 5 · Deploy marketing (Cloudflare Workers)
    runs-on: ubuntu-latest
    environment: production
    needs: [check-not-deployed, build-web-production, migrate-production]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup workspace
        uses: ./.github/actions/setup
        with:
          skip-checkout: "true"
          infisical-env-slug: prod
          infisical-domain: ${{ secrets.INFISICAL_DOMAIN }}
          infisical-identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}

      - name: Download Worker deploy artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-worker-artifacts

      - name: Restore Worker deploy artifacts
        run: tar -xzf production-worker-artifacts.tar.gz

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/wrangler-deploy-retry.sh packages/marketing --config wrangler.production.jsonc

  smoke-production:
    name: Production · 6 · Smoke
    runs-on: ubuntu-latest
    environment: production
    needs:
      [
        check-not-deployed,
        deploy-fly-production,
        deploy-web-production,
        deploy-marketing-production,
      ]
    if: needs.check-not-deployed.outputs.should_deploy == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          domain: ${{ secrets.INFISICAL_DOMAIN }}
          identity-id: ${{ secrets.INFISICAL_OIDC_IDENTITY_ID }}
          project-slug: slugbase-cloud
          env-slug: prod

      - name: Smoke health endpoints
        run: bash .github/scripts/smoke-staging-health.sh

  deployment-production-finish:
    name: Production · 7 · Deployment record finish
    runs-on: ubuntu-latest
    needs: [deployment-production-start, smoke-production]
    if: >-
      always()
      && github.event_name == 'release'
      && needs.deployment-production-start.result != 'skipped'
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Update deployment status
        uses: chrnorm/deployment-status@598d987f3a8dec3817b995f810e6de7c06c92106 # v1
        with:
          token: ${{ github.token }}
          deployment_id: ${{ needs.deployment-production-start.outputs.deployment_id }}
          state: ${{ needs.smoke-production.result == 'success' && 'success' || 'failure' }}

  record-deployed-version:
    name: Production · 8 · Record deployed version
    runs-on: ubuntu-latest
    environment: production
    needs:
      [
        check-not-deployed,
        deploy-fly-production,
        deploy-web-production,
        deploy-marketing-production,
        push-ghcr-image,
        smoke-production,
      ]
    if: >-
      needs.check-not-deployed.outputs.should_deploy == 'true'
      && needs.deploy-fly-production.result == 'success'
      && needs.deploy-web-production.result == 'success'
      && needs.deploy-marketing-production.result == 'success'
      && needs.push-ghcr-image.result == 'success'
      && needs.smoke-production.result == 'success'
    permissions:
      actions: write
    steps:
      - name: Update DEPLOYED_VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh variable set DEPLOYED_VERSION --body "${{ github.event.release.tag_name }}"
