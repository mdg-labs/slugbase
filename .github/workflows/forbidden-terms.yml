name: Forbidden terms

# Keeps internal infrastructure and Cloud-only names out of this public
# repository (doc 09 §4).

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  forbidden-terms:
    name: Forbidden terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - run: scripts/check-forbidden-terms.sh
