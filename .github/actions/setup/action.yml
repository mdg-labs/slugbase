name: Setup workspace
description: pnpm, Node.js, dependencies, and Infisical OIDC secrets

inputs:
  skip-checkout:
    description: Set to true when checkout already ran in the job
    required: false
    default: "false"
  skip-infisical:
    description: Skip Infisical secrets fetch
    required: false
    default: "false"
  infisical-env-slug:
    description: Infisical environment slug (dev, staging, prod)
    required: false
    default: dev
  infisical-domain:
    description: Infisical instance URL (GitHub secret)
    required: false
    default: ""
  infisical-identity-id:
    description: Infisical OIDC machine identity id (GitHub secret)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Checkout
      if: inputs.skip-checkout != 'true'
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v4.0.0
      with:
        version: 9.15.4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Fetch secrets from Infisical
      if: inputs.skip-infisical != 'true'
      uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
      with:
        method: oidc
        domain: ${{ inputs.infisical-domain }}
        identity-id: ${{ inputs.infisical-identity-id }}
        project-slug: slugbase-cloud
        env-slug: ${{ inputs.infisical-env-slug }}
