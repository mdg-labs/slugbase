name: Set up the workspace
description: >-
  Marks the checkout safe for git, installs pnpm from the packageManager field,
  restores the pnpm store and the Turborepo cache, and installs the workspace
  from the lockfile. Run it after actions/checkout inside the node container.

inputs:
  turbo-cache-key:
    description: Name of the Turborepo cache entry, one per job.
    required: true

runs:
  using: composite
  steps:
    - name: Mark the workspace safe for git
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Resolve the pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ inputs.turbo-cache-key }}-${{ github.sha }}
        restore-keys: turbo-${{ inputs.turbo-cache-key }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
